<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>产品库 · 机器视觉选型助手</title>
<meta name="description" content="四品牌机器视觉产品库：949 台面阵相机、44 台线阵相机、156 支镜头、473 款光源、43 款光源控制器，支持分类筛选、关键词查询与全参数查看，手机 / 电脑均可使用。" />
<link rel="icon" href="assets/favicon.ico" />
<style>
  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e3e9f1;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 520px at 12% -12%, rgba(30, 58, 138, .10), transparent 70%),
      radial-gradient(900px 500px at 100% 0%, rgba(14, 165, 233, .10), transparent 65%),
      var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    background: linear-gradient(135deg, #0b1220 0%, #132a4a 55%, #0d1b2e 100%);
    color: #fff;
    padding: 18px 20px 20px;
  }
  .topbar-inner { max-width: 1240px; margin: 0 auto; }
  .tb-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tb-title { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .tb-title small { font-weight: 400; font-size: 12.5px; color: #93a4bd; margin-left: 8px; }
  /* ---------- 全站导航（与选型助手 / 自定义搭配同一套） ---------- */
  .pnav { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pnav > a, .pnav > .on {
    display: inline-flex; align-items: center; white-space: nowrap; text-decoration: none;
    font-size: 12px; font-weight: 500; line-height: 1; border-radius: 999px; padding: 7px 13px;
    color: #cfdcee; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .18);
    transition: .15s;
  }
  .pnav > a:hover { background: rgba(56, 189, 248, .22); border-color: rgba(56, 189, 248, .55); color: #fff; }
  .pnav > .on {
    color: #fff; font-weight: 600;
    background: linear-gradient(180deg, rgba(56, 189, 248, .34), rgba(37, 99, 235, .34));
    border-color: rgba(56, 189, 248, .7);
  }
  .tb-stats { margin-top: 8px; font-size: 12.5px; color: #93a4bd; }
  .tb-stats b { color: #fff; font-weight: 600; }
  .tb-search { margin-top: 14px; position: relative; max-width: 560px; }
  .tb-search input {
    width: 100%; padding: 11px 40px 11px 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.10); color: #fff; font-size: 14px; font-family: inherit; outline: none;
  }
  .tb-search input::placeholder { color: #8fa2bd; }
  .tb-search input:focus { border-color: rgba(56,189,248,.6); background: rgba(255,255,255,.14); }
  .tb-search .s-ico {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #8fa2bd; font-size: 14px; pointer-events: none;
  }
  .tb-search .s-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: rgba(255,255,255,.14); color: #d7e3f4; width: 24px; height: 24px;
    border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1; display: none;
  }
  .tb-search.has-val .s-clear { display: block; }

  /* ---------- 类别标签 ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 60px; }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-family: inherit; cursor: pointer;
    white-space: nowrap; transition: all .15s;
  }
  .tab small { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
  .tab.on { background: linear-gradient(180deg, #38bdf8, #2563eb); border-color: transparent; color: #fff; }
  .tab.on small { color: rgba(255,255,255,.85); }

  /* ---------- 筛选区 ---------- */
  .filters {
    margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end;
  }
  .f-group { display: flex; flex-direction: column; gap: 5px; }
  .f-group > label { font-size: 11.5px; color: var(--muted); }
  .f-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: #fbfdff; color: var(--ink); font-family: inherit;
    font-size: 12px; border-radius: 999px; padding: 5px 12px; cursor: pointer; transition: all .12s;
  }
  .chip:hover { border-color: #93c5fd; }
  .chip.on { background: var(--accent-soft); border-color: #2563eb; color: var(--accent); font-weight: 600; }
  .filters select, .filters input[type="number"], .filters input[type="text"] {
    font-family: inherit; font-size: 12.5px; color: var(--ink); background: #fbfdff;
    border: 1px solid #d6e0ea; border-radius: 8px; padding: 6px 8px; outline: none; min-width: 0;
  }
  .filters select:focus, .filters input:focus { border-color: #2563eb; }
  .f-num { width: 96px; }
  .f-reset {
    margin-left: auto; border: 1px solid var(--line); background: #fff; color: var(--muted);
    font-family: inherit; font-size: 12px; border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .f-reset:hover { color: var(--danger, #dc2626); border-color: #fecaca; }
  .f-result { font-size: 12.5px; color: var(--muted); padding: 10px 2px 0; }
  .f-result b { color: var(--accent); }

  /* ---------- 表格（桌面） ---------- */
  .tbl-wrap {
    margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    overflow: auto; max-height: calc(100vh - 300px); min-height: 200px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; background: #f8fafc; color: #475569; font-size: 12px; font-weight: 600;
    text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 2;
  }
  tbody td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; vertical-align: middle; }
  tbody tr { cursor: pointer; transition: background .1s; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.model { font-weight: 600; font-family: Consolas, "Courier New", monospace; font-size: 12.5px; }
  .brand-tag {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: #475569;
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: #f8fafc; white-space: nowrap;
  }
  .brand-tag .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .cat-tag {
    display: inline-block; font-size: 11px; color: var(--accent); background: var(--accent-soft);
    border-radius: 5px; padding: 1px 6px; white-space: nowrap;
  }
  .dim { color: var(--muted); }
  .muted-cell { color: #94a3b8; }

  /* ---------- 对比 / 反查 / 等价 ---------- */
  td.cmp-col, th.cmp-col { text-align: center; width: 44px; }
  .cmp-box { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .cmp-chip {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .cmp-chip input { width: 13px; height: 13px; accent-color: var(--accent); }
  .cmp-tray {
    display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: #0f172a; color: #fff; border-radius: 999px; padding: 9px 10px 9px 18px;
    font-size: 12.5px; z-index: 40; box-shadow: 0 12px 30px -12px rgba(15, 23, 42, .6);
    align-items: center; gap: 10px; max-width: min(92vw, 680px);
  }
  .cmp-tray.show { display: flex; }
  .inquiry-tray { bottom: 70px; background: #14532d; }
  .inquiry-tray .t-go { background: #22c55e; }
  .inquiry-tray .t-clear { background: rgba(255, 255, 255, .14); }
  .combo-tray { bottom: 122px; background: #1e3a8a; }
  .combo-tray .t-go { background: #38bdf8; text-decoration: none; display: inline-block; }
  .combo-tray .t-clear { background: rgba(255, 255, 255, .14); }
  .cmp-tray .t-models { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd5e1; }
  .cmp-tray button {
    font-family: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 6px 13px; cursor: pointer;
  }
  .cmp-tray .t-go { background: linear-gradient(180deg, #38bdf8, #2563eb); color: #fff; }
  .cmp-tray .t-clear { background: rgba(255, 255, 255, .14); color: #e2e8f0; }
  .fit-tag {
    display: inline-block; font-size: 11px; border-radius: 5px; padding: 1px 6px; white-space: nowrap;
  }
  .fit-tag.direct { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }
  .fit-tag.adapter { color: #92400e; background: #fffbeb; border: 1px solid #fde68a; }
  .lf-banner {
    flex: 1 1 100%; background: var(--accent-soft); border: 1px solid #bfdbfe; color: #1e40af;
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: flex; align-items: center;
    gap: 6px; flex-wrap: wrap;
  }
  .lf-banner b { font-weight: 700; }
  .lf-banner .lf-close {
    margin-left: auto; font-family: inherit; font-size: 11.5px; border: 1px solid #93c5fd;
    background: #fff; color: var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  .x-block { padding: 4px 18px 12px; }
  .x-btn {
    width: 100%; font-family: inherit; font-size: 13px; color: var(--accent); background: var(--accent-soft);
    border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 12px; cursor: pointer;
  }
  .x-btn:hover { background: #dbeafe; }
  /* 询价清单底部操作条：贴在弹层底边常驻，主按钮占满、清空为次要按钮 */
  .inq-actions {
    position: sticky; bottom: 0; z-index: 2; margin-top: 6px;
    display: flex; gap: 10px; padding: 10px 18px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .inq-actions .x-btn { width: auto; flex: 0 0 auto; white-space: nowrap; }
  .inq-actions .inq-copy {
    flex: 1 1 auto; color: #fff; border-color: transparent; font-weight: 600;
    background: linear-gradient(180deg, #38bdf8, #2563eb);
  }
  .inq-actions .inq-copy:hover { background: linear-gradient(180deg, #38bdf8, #2563eb); filter: brightness(1.06); }
  .inq-actions .inq-clear { color: #dc2626; background: #fff; border-color: #fecaca; }
  .inq-actions .inq-clear:hover { background: #fef2f2; border-color: #fca5a5; }
  .sheet-inq { padding-bottom: 0; }
  .x-title { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .x-title .x-note { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 6px; }
  .x-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .x-item {
    display: flex; align-items: center; gap: 7px; font-family: inherit; cursor: pointer;
    border: 1px solid var(--line); background: #fbfdff; border-radius: 10px; padding: 5px 9px 5px 5px;
  }
  .x-item:hover { border-color: #93c5fd; background: var(--accent-soft); }
  .x-item svg { width: 30px; height: 30px; border-radius: 6px; }
  .x-item .x-model { font-size: 12px; font-weight: 600; font-family: Consolas, "Courier New", monospace; }
  .inq-add {
    margin-left: auto; font-family: inherit; font-size: 11.5px; cursor: pointer;
    color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 999px; padding: 4px 12px;
    white-space: nowrap;
  }
  .inq-add.on { background: #dcfce7; border-color: #86efac; font-weight: 600; }
  .combo-add { color: #1d4ed8; background: #eff6ff; border-color: #bfdbfe; }
  .combo-add.on { background: #dbeafe; border-color: #93c5fd; font-weight: 600; color: #1e40af; }
  .combo-add + .inq-add { margin-left: 0; }
  /* 收藏：列表星标 + 详情按钮，收藏后搭配页选择器可直接选 */
  td.fav-col, th.fav-col { text-align: center; width: 30px; padding-left: 4px; padding-right: 0; }
  .fav-btn {
    font-family: inherit; font-size: 13px; line-height: 1; cursor: pointer; vertical-align: middle;
    border: 0; background: transparent; color: #cbd5e1; padding: 3px 2px; border-radius: 6px;
  }
  .fav-btn:hover { color: #f59e0b; background: #fffbeb; }
  .fav-btn.on { color: #f59e0b; }
  .card-fav { flex: 0 0 auto; }
  .fav-add { color: #b45309; background: #fffbeb; border-color: #fde68a; }
  .fav-add:hover { background: #fef3c7; border-color: #fcd34d; }
  .fav-add.on { background: #fef3c7; border-color: #fcd34d; font-weight: 600; }
  .x-mini {
    font-family: inherit; font-size: 11px; border: 1px solid var(--line); background: #fff;
    color: var(--accent); border-radius: 7px; padding: 3px 9px; cursor: pointer; margin-left: 6px;
  }
  .x-mini:hover { border-color: #93c5fd; }
  .x-mini.danger { color: #dc2626; border-color: #fecaca; }
  .x-mini.danger:hover { background: #fef2f2; }
  .sheet-wide { max-width: 920px; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cmp-table th, .cmp-table td {
    border-bottom: 1px solid #f1f5f9; padding: 7px 10px; vertical-align: top; word-break: break-all;
  }
  .cmp-table thead th { position: sticky; top: 0; background: var(--panel); font-size: 12px; }
  .cmp-table td.k { color: var(--muted); white-space: nowrap; width: 34%; }
  .cmp-table td.diff { background: #fefce8; }
  td.art-cell { padding: 4px 6px 4px 8px; width: 52px; }
  td.art-cell svg, .card-art svg { display: block; border-radius: 8px; }
  td.art-cell svg { width: 44px; height: 44px; }
  .card-art svg { width: 72px; height: 72px; }
  .sheet-art svg { width: 180px; height: 180px; display: block; margin: 12px auto 2px; }
  .sheet-art { border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }

  /* ---------- 卡片（移动端） ---------- */
  .cards { display: none; margin-top: 10px; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    cursor: pointer;
  }
  .card:active { background: var(--accent-soft); }
  .card-flex { display: flex; gap: 12px; align-items: flex-start; }
  .card-art { flex: 0 0 auto; }
  .card-main { flex: 1 1 auto; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-model { font-weight: 700; font-size: 14px; font-family: Consolas, "Courier New", monospace; word-break: break-all; }
  .card-specs {
    margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .card-specs .spec {
    display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%;
    background: #f8fafc; border: 1px solid #eef2f7; border-radius: 7px;
    padding: 3px 9px; font-size: 11.5px; line-height: 1.5;
  }
  .card-specs .k { color: var(--muted); flex: 0 0 auto; }
  .card-specs .v { color: var(--ink); font-weight: 600; word-break: break-word; font-variant-numeric: tabular-nums; }

  /* ---------- 分页 ---------- */
  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
  .pager button {
    font-family: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 9px; padding: 7px 16px; cursor: pointer;
  }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager button:not(:disabled):hover { border-color: #2563eb; color: var(--accent); }
  .pager .pg-info { font-size: 12.5px; color: var(--muted); }

  /* ---------- 详情弹层 ---------- */
  .mask {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, .55); z-index: 50;
    align-items: flex-end; justify-content: center; padding: 0;
  }
  .mask.show { display: flex; }
  .sheet {
    background: var(--panel); width: 100%; max-width: 640px; max-height: 86vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 0 0 16px;
  }
  @media (min-width: 640px) {
    .mask { align-items: center; padding: 20px; }
    .sheet { border-radius: 18px; }
  }
  .sheet-head {
    position: sticky; top: 0; background: var(--panel); padding: 16px 18px 10px;
    border-bottom: 1px solid var(--line); z-index: 2;
  }
  .sheet-head .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sheet-model { font-size: 17px; font-weight: 700; font-family: Consolas, "Courier New", monospace; word-break: break-all; }
  .sheet-close {
    margin-left: auto; border: 1px solid var(--line); background: #fff; color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; flex: 0 0 auto;
  }
  .sheet-logo { height: 22px; max-width: 120px; object-fit: contain; }
  .sheet-meta { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .kv-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  .kv-table td { padding: 8px 18px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  .kv-table td.k { color: var(--muted); width: 40%; white-space: nowrap; }
  .kv-table td.v { word-break: break-all; }
  .kv-table tr:last-child td { border-bottom: 0; }

  footer {
    max-width: 1240px; margin: 0 auto; padding: 0 20px 40px; font-size: 12px; color: var(--muted); line-height: 1.8;
  }

  /* ---------- 移动端 ---------- */
  @media (max-width: 860px) {
    .tbl-wrap { display: none; }
    .cards { display: flex; }
    /* 类别标签换行铺满，不做横向截断 */
    .tabs { flex-wrap: wrap; }
    .wrap { padding: 14px 12px 60px; }
    .topbar { padding: 14px 12px 16px; }
    .filters { padding: 10px 12px; gap: 8px 14px; }
    .f-reset { margin-left: 0; }
    .f-num { width: 84px; }
    .tb-row { gap: 8px; }
    /* 导航：窄屏独占一行横滑，不再拆成上下两个按钮 */
    .pnav { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .pnav > a, .pnav > .on { font-size: 11.5px; padding: 6px 11px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="tb-row">
      <span class="tb-title">产品库<small>机器视觉选型助手 · 全量型号查询</small></span>
      <nav class="pnav" aria-label="页面导航">
        <a href="home.html">主页</a>
        <a href="index.html">选型助手</a>
        <span class="on" aria-current="page">产品库</span>
        <a href="combo.html">自定义搭配</a>
      </nav>
    </div>
    <div class="tb-stats" id="stats"></div>
    <div class="tb-search" id="searchBox">
      <span class="s-ico">🔍</span>
      <input id="search" type="search" placeholder="搜型号 / 系列 / 传感器，如 CS016、IMX273、HN-25…" autocomplete="off" />
      <button class="s-clear" id="searchClear" title="清空">✕</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div class="f-result" id="resultInfo"></div>

  <div class="tbl-wrap">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="cards" id="cards"></div>

  <div class="pager">
    <button id="pgPrev">上一页</button>
    <span class="pg-info" id="pgInfo"></span>
    <button id="pgNext">下一页</button>
  </div>
</div>

<div class="cmp-tray" id="cmpTray"></div>
<div class="cmp-tray inquiry-tray" id="inqTray"></div>
<div class="cmp-tray combo-tray" id="comboTray"></div>

<div class="mask" id="mask">
  <div class="sheet" id="sheet"></div>
</div>

<footer id="foot"></footer>

<script src="brands.js"></script>
<script src="hikrobot-catalog.js"></script>
<script src="hikrobot-3d-catalog.js"></script>
<script src="hikrobot-ipc-catalog.js"></script>
<script src="huarui-catalog.js"></script>
<script src="basler-catalog.js"></script>
<script src="basler-lens-catalog.js"></script>
<script src="basler-light-catalog.js"></script>
<script src="daheng-catalog.js"></script>
<script>
(function () {
  'use strict';

  /* ============ 1. 数据归并 ============ */
  // 类别定义：key / 名称 / 图标
  var CATS = [
    { key: 'cam',   name: '面阵相机', catName: '面阵相机' },
    { key: 'line',  name: '线阵相机', catName: '线阵相机' },
    { key: 'lens',  name: '镜头',     catName: '工业镜头' },
    { key: 'tele',  name: '远心镜头', catName: '远心镜头' },
    { key: 'light', name: '光源',     catName: '光源' },
    { key: 'ctrl',  name: '光源控制器', catName: '光源控制器' },
    { key: 'prof',  name: '3D 相机',  catName: '3D 传感器' },
    { key: 'ipc',   name: '工控机',   catName: '工控机' },
    { key: 'fav',   name: '★ 收藏',   catName: '收藏' },
    { key: 'all',   name: '全部',     catName: '全部类别' }
  ];

  var SRC = { hikrobot: 'HikrobotCatalog', huarui: 'HuaruiCatalog', basler: 'BaslerCatalog', daheng: 'DahengCatalog' };
  // 附加库：海康 3D / 工控机；Basler 镜头 / 灯光（挂到对应品牌与类别）
  var EXTRA_SRC = [
    { global: 'Hikrobot3DCatalog', brand: 'hikrobot', arrays: { PROFILERS: 'prof', SMART: 'prof' } },
    { global: 'HikrobotIpcCatalog', brand: 'hikrobot', arrays: { CHASSIS: 'ipc', BOARDS: 'ipc' } },
    { global: 'BaslerLensCatalog', brand: 'basler', arrays: { LENSES: 'lens', TELECENTRIC: 'tele' } },
    { global: 'BaslerLightCatalog', brand: 'basler', arrays: { LIGHTS: 'light', CONTROLLERS: 'ctrl' } }
  ];

  var LIGHT_TYPE_LABEL = {
    backlight: '面光源（背光）', backlight_hole: '中孔面光源', backlight_parallel: '平行面光源',
    backlight_side: '侧导面光源', bar: '条形光源', bar_array: '组合条形光源', coaxial: '同轴光源',
    dome: '穹顶光源', flat_shadowless: '无影面光源', line: '线光源', line_coax: '同轴线光源',
    line_focus: '聚光线光源', line_high: '高亮线光源', point: '点光源', ring: '环形光源', ring_dome: '环形无影光源',
    darkfield: '暗场光源', flood: '泛光面光源'
  };
  var COLOR_LABEL = { white: '白', red: '红', blue: '蓝', green: '绿', ir: '红外', uv: '紫外', cyan: '青', yellow: '黄' };
  var COLOR_CSS = { white: '#94a3b8', red: '#dc2626', blue: '#2563eb', green: '#16a34a', ir: '#7c3aed', uv: '#a21caf', cyan: '#0891b2', yellow: '#ca8a04' };
  var MOUNT_LABEL = { Bare: '板级无口', 'M42/F': 'M42/F', V38: 'V38（线扫口）' };
  var FORM_LABEL = { area: '面阵', board: '板级', '面阵': '面阵', '板级': '板级' };

  function mountText(m) { return m == null ? null : (MOUNT_LABEL[m] || m); }
  function lightTypeText(t) { return LIGHT_TYPE_LABEL[t] || t; }
  function lightColorText(c) { return c == null ? null : (COLOR_LABEL[c] || c); }
  // 环形/环形无影光源 size 为 [外径, 照射角]（第二维是照射角，不是内径，绝不交换）
  function fmtSize(s, type) {
    if (s == null) return null;
    if (!Array.isArray(s)) return String(s);
    if (/^ring/.test(type || '') && s.length >= 2) {
      var w = s[0], ang = s[1];
      return (ang > 0) ? 'Ø' + w + '（' + ang + '° 照射角）' : 'Ø' + w;
    }
    return s.join(' × ') + ' mm';
  }
  // 曝光时间（µs）→ 人话
  function expText(us) {
    if (us == null) return null;
    if (us < 1000) return us + ' µs';
    if (us < 1000000) return (us / 1000).toFixed(us % 1000 ? 1 : 0) + ' ms';
    return (us / 1000000) + ' s';
  }

  var items = [];   // { cat, brand(key), d(原始对象) }
  var metas = {};   // brand → META（主库）
  var allMetas = []; // {brand, meta} 全部已加载库的数据来源（页脚展示用）

  Object.keys(SRC).forEach(function (bk) {
    var c = window[SRC[bk]];
    if (!c) return;
    metas[bk] = c.META || {};
    if (c.META) allMetas.push({ brand: bk, meta: c.META });
    (c.CAMERAS || []).forEach(function (d) { items.push({ cat: 'cam', brand: bk, d: d }); });
    (c.LINESCAN || []).forEach(function (d) { items.push({ cat: 'line', brand: bk, d: d }); });
    (c.LENSES || []).forEach(function (d) { items.push({ cat: 'lens', brand: bk, d: d }); });
    (c.TELECENTRIC || []).forEach(function (d) { items.push({ cat: 'tele', brand: bk, d: d }); });
    (c.LIGHTS || []).forEach(function (d) { items.push({ cat: 'light', brand: bk, d: d }); });
    (c.CONTROLLERS || []).forEach(function (d) { items.push({ cat: 'ctrl', brand: bk, d: d }); });
  });
  EXTRA_SRC.forEach(function (es) {
    var c = window[es.global];
    if (!c) return;
    if (c.META) allMetas.push({ brand: es.brand, meta: c.META });
    Object.keys(es.arrays).forEach(function (arrKey) {
      var cat = es.arrays[arrKey];
      (c[arrKey] || []).forEach(function (d) { items.push({ cat: cat, brand: es.brand, d: d }); });
    });
  });

  var BRAND_BY_KEY = {};
  (window.BRAND_KEYS || Object.keys(window.BRANDS || {})).forEach(function (k) {
    BRAND_BY_KEY[k] = (window.BRANDS[k] && window.BRANDS[k].short) || k;
  });
  function brandShort(k) { return BRAND_BY_KEY[k] || k; }
  function brandColor(k) { return (window.BRANDS[k] && window.BRANDS[k].color) || '#64748b'; }
  function brandLogo(k) { return (window.BRANDS[k] && window.BRANDS[k].logo) || null; }

  /* ============ 2. 每类展示配置 ============ */
  // 取值函数：返回字符串或 null（null 显示 —）
  function V(fn) { return fn; }
  function mp(d) { return (d.w && d.h) ? (d.w * d.h / 1e6) : null; }
  function mpText(d) { var m = mp(d); return m == null ? null : (m >= 100 ? m.toFixed(0) : m.toFixed(1)) + ' MP'; }
  function resText(d) { return (d.w && d.h) ? d.w + '×' + d.h : null; }
  function formText(d) { return FORM_LABEL[d.kind] || null; }

  var COLS = {
    all: [
      { h: '', art: true },
      { h: '类别', get: V(function (it) { var c = CATS.filter(function (x) { return x.key === it.cat; })[0]; return c ? c.catName : ''; }), raw: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model || it.d.series || ''; }), raw: true },
      { h: '品牌', get: V(function (it) { return brandShort(it.brand); }), raw: true, tag: 'brand' },
      { h: '关键参数', get: V(function (it) { return keySpecText(it) || ''; }), raw: true, dim: true }
    ],
    cam: [
      { h: '', art: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model; }), raw: true },
      { h: '品牌', brand: true },
      { h: '形态', get: V(function (it) { return formText(it.d); }) },
      { h: '分辨率', get: V(function (it) { return resText(it.d); }) },
      { h: '像素', cls: 'num', get: V(function (it) { return mpText(it.d); }) },
      { h: '像元 µm', cls: 'num', get: V(function (it) { return it.d.pxUm; }) },
      { h: '靶面', get: V(function (it) { return it.d.size; }) },
      { h: '帧率 fps', cls: 'num', get: V(function (it) { return it.d.fps; }) },
      { h: '接口', get: V(function (it) { return it.d.iface; }) },
      { h: '彩色', get: V(function (it) { return it.d.color; }) },
      { h: '卡口', get: V(function (it) { return mountText(it.d.mount); }) },
      { h: '传感器', dim: true, get: V(function (it) { return it.d.sensor; }) }
    ],
    line: [
      { h: '', art: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model; }), raw: true },
      { h: '品牌', brand: true },
      { h: '行宽 px', cls: 'num', get: V(function (it) { return it.d.w; }) },
      { h: '像元 µm', cls: 'num', get: V(function (it) { return it.d.pxH != null ? (it.d.pxV != null && it.d.pxV !== it.d.pxH ? it.d.pxH + '/' + it.d.pxV : it.d.pxH) : null; }) },
      { h: '行频 kHz', cls: 'num', get: V(function (it) { return it.d.lineRateMax || it.d.lineRate; }) },
      { h: '接口', get: V(function (it) { return it.d.iface; }) },
      { h: '彩色', get: V(function (it) { return it.d.color; }) },
      { h: '卡口', get: V(function (it) { return mountText(it.d.mount); }) },
      { h: '传感器', dim: true, get: V(function (it) { return it.d.sensor; }) }
    ],
    lens: [
      { h: '', art: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model; }), raw: true },
      { h: '品牌', brand: true },
      { h: '焦距 mm', cls: 'num', get: V(function (it) { return it.d.focal; }) },
      { h: '光圈', get: V(function (it) { return it.d.fmin != null ? 'F' + it.d.fmin + '–' + it.d.fmax : null; }) },
      { h: '卡口', get: V(function (it) { return mountText(it.d.mount); }) },
      { h: '靶面', get: V(function (it) { return it.d.fmt; }) },
      { h: '像面 Ø mm', cls: 'num', get: V(function (it) { return it.d.ic; }) },
      { h: '像素', cls: 'num', get: V(function (it) { return it.d.mp != null ? it.d.mp + ' MP' : null; }) },
      { h: '最近工作距离', get: V(function (it) { return it.d.minDist != null ? it.d.minDist + ' m' : null; }) },
      { h: '系列', dim: true, get: V(function (it) { return it.d.series; }) }
    ],
    tele: [
      { h: '', art: true },
      { h: '系列', cls: 'model', get: V(function (it) { return it.d.series; }), raw: true },
      { h: '品牌', brand: true },
      { h: '型号规则', get: V(function (it) { return it.d.model; }) },
      { h: '倍率', cls: 'num', get: V(function (it) {
        var d = it.d;
        if (d.magMin == null) return null;
        return d.magMin === d.magMax ? d.magMin + '×（固定）' : d.magMin + '×–' + d.magMax + '×';
      }) },
      { h: '工作距离 mm', cls: 'num', get: V(function (it) {
        var d = it.d;
        if (d.wdMin == null) return null;
        return d.wdMin === d.wdMax ? String(d.wdMin) : d.wdMin + '–' + d.wdMax;
      }) },
      { h: '靶面', get: V(function (it) { return it.d.fmt; }) },
      { h: '卡口', get: V(function (it) { return mountText(it.d.mount); }) },
      { h: '同轴', get: V(function (it) { return it.d.coax ? '支持' : null; }) }
    ],
    light: [
      { h: '', art: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model; }), raw: true },
      { h: '品牌', brand: true },
      { h: '类型', get: V(function (it) { return lightTypeText(it.d.type); }) },
      { h: '颜色', color: true, get: V(function (it) { return lightColorText(it.d.color); }) },
      { h: '尺寸', get: V(function (it) { return fmtSize(it.d.size, it.d.type); }) },
      { h: '功率 W', cls: 'num', get: V(function (it) { return it.d.power; }) },
      { h: '角度 °', cls: 'num', get: V(function (it) { return it.d.angle; }) }
    ],
    ctrl: [
      { h: '', art: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model; }), raw: true },
      { h: '品牌', brand: true },
      { h: '通道', cls: 'num', get: V(function (it) { return it.d.channels; }) },
      { h: '调光模式', get: V(function (it) { return it.d.mode; }) },
      { h: '频闪', get: V(function (it) { return it.d.strobe ? '支持' : null; }) }
    ],
    prof: [
      { h: '', art: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model; }), raw: true },
      { h: '品牌', brand: true },
      { h: '子类', get: V(function (it) { return profKind(it.d); }) },
      { h: '视场 / 测量范围', get: V(function (it) { var d = it.d; return d.kind === 'profiler' ? (d.xRange && d.zRange ? d.xRange + ' × ' + d.zRange : null) : d.fov; }) },
      { h: '参考距离 / 工作范围', get: V(function (it) { var d = it.d; return d.kind === 'profiler' ? d.ref : d.work; }) },
      { h: '精度 / Z 分辨率', get: V(function (it) { var d = it.d; return d.kind === 'profiler' ? d.zRepeat : d.accuracy; }) },
      { h: '帧率 / 行频', get: V(function (it) { var d = it.d; return d.kind === 'profiler' ? d.rate : d.fps; }) },
      { h: '激光 / 接口', get: V(function (it) { var d = it.d; return d.kind === 'profiler' ? d.laser : d.iface; }) }
    ],
    ipc: [
      { h: '', art: true },
      { h: '型号', cls: 'model', get: V(function (it) { return it.d.model; }), raw: true },
      { h: '品牌', brand: true },
      { h: '子类', get: V(function (it) { return it.d.series; }) },
      { h: 'CPU / 适用主板', get: V(function (it) { return it.d.cpu || it.d.board; }) },
      { h: '内存', get: V(function (it) { return it.d.ram; }) },
      { h: '网口 / 扩展', get: V(function (it) { return it.d.lan || it.d.io; }) },
      { h: '外形尺寸', get: V(function (it) { return it.d.form || it.d.size; }) }
    ]
  };

  function profKind(d) {
    if (d.kind === 'profiler') return '激光轮廓传感器';
    return d.kind || '3D 相机';
  }

  // 全部视图的「关键参数」列
  function keySpecText(it) {
    var d = it.d, s = [];
    if (it.cat === 'cam') { s.push(resText(d)); s.push(d.iface); s.push(d.color); s.push(d.size); }
    else if (it.cat === 'line') { s.push(d.w + ' px'); s.push(d.iface); s.push(d.color); }
    else if (it.cat === 'lens') { s.push(d.focal + ' mm'); s.push(mountText(d.mount)); s.push(d.fmt); }
    else if (it.cat === 'tele') { s.push(d.model); }
    else if (it.cat === 'light') { s.push(lightTypeText(d.type)); s.push(lightColorText(d.color)); s.push(fmtSize(d.size, d.type)); }
    else if (it.cat === 'ctrl') { s.push(d.channels + ' 通道'); s.push(d.mode); }
    else if (it.cat === 'prof') {
      s.push(profKind(d));
      if (d.kind === 'profiler') { s.push(d.points + ' 点'); s.push(d.xRange && d.zRange ? d.xRange + ' × ' + d.zRange : null); s.push(d.zRepeat); }
      else { s.push(d.fov); s.push(d.work); s.push(d.accuracy); }
    }
    else if (it.cat === 'ipc') { s.push(d.series); s.push(d.cpu || d.board); s.push(d.form || d.size); }
    return s.filter(Boolean).join(' · ');
  }

  // 详情字段表
  var DETAIL = {
    cam: [
      ['型号', function (d) { return d.model; }],
      ['形态', function (d) { return formText(d); }],
      ['分辨率（像素）', function (d) { return resText(d); }],
      ['分辨率', function (d) { return mpText(d); }],
      ['像元尺寸', function (d) { return d.pxUm != null ? d.pxUm + ' µm' : null; }],
      ['靶面尺寸', function (d) { return d.size; }],
      ['传感器', function (d) { return d.sensor; }],
      ['帧率', function (d) { return d.fps != null ? d.fps + ' fps' : null; }],
      ['快门', function (d) { return d.shutter === 'Global' ? '全局快门' : d.shutter; }],
      ['接口', function (d) { return d.iface; }],
      ['彩色 / 黑白', function (d) { return d.color; }],
      ['数据位宽', function (d) { return d.bit != null ? d.bit + ' bit' : null; }],
      ['镜头卡口', function (d) { return mountText(d.mount); }],
      ['产品系列', function (d) { return d.series; }],
      ['动态范围', function (d) { return d.dr != null ? d.dr + ' dB' : null; }],
      ['信噪比', function (d) { return d.snr != null ? d.snr + ' dB' : null; }],
      ['最短曝光', function (d) { return expText(d.expMinUs); }],
      ['最长曝光', function (d) { return expText(d.expMaxUs); }],
      ['PoE 供电', function (d) { return d.poe != null ? (d.poe ? '支持' : '不支持') : null; }],
      ['功耗', function (d) { return (d.powerW != null ? d.powerW + ' W' : (d.power != null ? d.power + ' W' : null)); }],
      ['外形尺寸（宽×高×长 mm）', function (d) { return Array.isArray(d.dims) ? d.dims.join(' × ') : null; }],
      ['配套镜头系列', function (d) { return d.lens; }]
    ],
    line: [
      ['型号', function (d) { return d.model; }],
      ['行宽（像素）', function (d) { return d.w; }],
      ['像元尺寸', function (d) { return d.pxH != null ? d.pxH + ' µm' + (d.pxV != null && d.pxV !== d.pxH ? '（行）× ' + d.pxV + ' µm（列）' : '') : null; }],
      ['行频', function (d) { return d.lineRate != null ? d.lineRate + ' kHz' : null; }],
      ['最大行频', function (d) { return d.lineRateMax != null ? d.lineRateMax + ' kHz' : null; }],
      ['传感器', function (d) { return d.sensor; }],
      ['接口', function (d) { return d.iface; }],
      ['彩色 / 黑白', function (d) { return d.color; }],
      ['镜头卡口', function (d) { return mountText(d.mount); }],
      ['产品系列', function (d) { return d.series; }],
      ['最短曝光', function (d) { return expText(d.expMinUs); }],
      ['功耗', function (d) { return (d.powerW != null ? d.powerW + ' W' : (d.power != null ? d.power + ' W' : null)); }]
    ],
    lens: [
      ['型号', function (d) { return d.model; }],
      ['产品系列', function (d) { return d.series; }],
      ['焦距', function (d) { return d.focal != null ? d.focal + ' mm' : null; }],
      ['光圈范围', function (d) { return d.fmin != null ? 'F' + d.fmin + ' – F' + d.fmax : null; }],
      ['镜头卡口', function (d) { return mountText(d.mount); }],
      ['支持靶面', function (d) { return d.fmt; }],
      ['像面直径', function (d) { return d.ic != null ? 'Ø ' + d.ic + ' mm' : null; }],
      ['支持像素', function (d) { return d.mp != null ? d.mp + ' MP' : null; }],
      ['光学畸变', function (d) { return d.dist != null ? d.dist + '%' : null; }],
      ['最近工作距离', function (d) { return d.minDist != null ? d.minDist + ' m' : null; }],
      ['镜身长度', function (d) { return d.len != null ? d.len + ' mm' : null; }]
    ],
    tele: [
      ['系列', function (d) { return d.series; }],
      ['型号规则', function (d) { return d.model; }],
      ['倍率范围', function (d) { return d.magMin != null ? d.magMin + '× – ' + d.magMax + '×' : null; }],
      ['工作距离范围', function (d) { return d.wdMin != null ? d.wdMin + ' – ' + d.wdMax + ' mm' : null; }],
      ['支持靶面', function (d) { return d.fmt; }],
      ['镜头卡口', function (d) { return mountText(d.mount); }],
      ['同轴光', function (d) { return d.coax ? '支持' : null; }],
      ['类型', function (d) { return d.kind; }]
    ],
    light: [
      ['型号', function (d) { return d.model; }],
      ['产品名称', function (d) { return d.name; }],
      ['类型', function (d) { return lightTypeText(d.type); }],
      ['颜色', function (d) { return lightColorText(d.color); }],
      ['尺寸', function (d) { return fmtSize(d.size, d.type); }],
      ['功率', function (d) { return d.power != null ? d.power + ' W' : null; }],
      ['发光角度', function (d) { return d.angle != null ? d.angle + '°' : null; }]
    ],
    ctrl: [
      ['型号', function (d) { return d.model; }],
      ['通道数', function (d) { return d.channels; }],
      ['调光模式', function (d) { return d.mode; }],
      ['频闪', function (d) { return d.strobe != null ? (d.strobe ? '支持' : '不支持') : null; }]
    ],
    prof: [
      ['型号', function (d) { return d.model; }],

      { k: 'ch', t: '通道数 多→少', fn: function (a, b) { return (b.d.channels || 0) - (a.d.channels || 0); } }
    ],
    prof: [
      { k: 'brand', t: '按品牌 / 型号', fn: function (a, b) { return a.brand.localeCompare(b.brand) || String(a.d.model).localeCompare(String(b.d.model)); } },
      { k: 'points', t: '点数 多→少', fn: function (a, b) { return (b.d.points || 0) - (a.d.points || 0); } }
    ],
    ipc: [
      { k: 'brand', t: '按品牌 / 型号', fn: function (a, b) { return a.brand.localeCompare(b.brand) || String(a.d.model).localeCompare(String(b.d.model)); } }
    ],
    all: [
      { k: 'brand', t: '按品牌 / 型号', fn: function (a, b) { return a.brand.localeCompare(b.brand) || a.cat.localeCompare(b.cat) || String(a.d.model).localeCompare(String(b.d.model)); } }
    ]
  };

  // 每类的下拉筛选定义：{ k, label, get(it)->值, num?:数字下限 }
  var FILTER_DEFS = {
    cam: [
      { k: 'iface', label: '接口', get: function (it) { return it.d.iface; } },
      { k: 'color', label: '彩色 / 黑白', get: function (it) { return it.d.color; } },
      { k: 'mount', label: '卡口', get: function (it) { return mountText(it.d.mount); } },
      { k: 'form', label: '形态', get: function (it) { return formText(it.d); } },
      { k: 'mpMin', label: '分辨率 ≥ (MP)', num: true, val: function (it) { return mp(it.d); } }
    ],
    line: [
      { k: 'iface', label: '接口', get: function (it) { return it.d.iface; } },
      { k: 'color', label: '彩色 / 黑白', get: function (it) { return it.d.color; } }
    ],
    lens: [
      { k: 'mount', label: '卡口', get: function (it) { return mountText(it.d.mount); } },
      { k: 'focalMin', label: '焦距 ≥ (mm)', num: true, val: function (it) { return it.d.focal; } },
      { k: 'focalMax', label: '焦距 ≤ (mm)', num: true, val: function (it) { return it.d.focal; }, max: true }
    ],
    tele: [],
    light: [
      { k: 'type', label: '类型', get: function (it) { return lightTypeText(it.d.type); } },
      { k: 'lcolor', label: '颜色', get: function (it) { return lightColorText(it.d.color); } }
    ],
    ctrl: [
      { k: 'chMin', label: '通道数 ≥', num: true, val: function (it) { return it.d.channels; } },
      { k: 'strobe', label: '频闪', get: function (it) { return it.d.strobe ? '支持频闪' : null; } }
    ],
    prof: [
      { k: 'kind', label: '子类', get: function (it) { return profKind(it.d); } }
    ],
    ipc: [
      { k: 'series', label: '子类', get: function (it) { return it.d.series; } }
    ],
    all: []
  };

  /* ============ 4. 状态与渲染 ============ */
  var state = {
    cat: 'cam',
    q: '',
    brand: '',            // '' = 全部品牌
    sel: {},              // 各下拉筛选 { 'cam.iface': 'USB3', ... }
    sort: 'brand',
    page: 1,
    lensFor: null,        // 适配镜头反查：{ model, mounts:Set, adapter:Set, minIc, minMp }
    compare: []           // 横向对比：型号 item 引用，最多 4
  };
  var PAGE_SIZE = 50;
  var isMobile = window.matchMedia('(max-width: 860px)');

  function selKey(def) { return state.cat + '.' + def.k; }

  var $tabs = document.getElementById('tabs');
  var $filters = document.getElementById('filters');
  var $thead = document.getElementById('thead');
  var $tbody = document.getElementById('tbody');
  var $cards = document.getElementById('cards');
  var $result = document.getElementById('resultInfo');
  var $pgPrev = document.getElementById('pgPrev');
  var $pgNext = document.getElementById('pgNext');
  var $pgInfo = document.getElementById('pgInfo');
  var $mask = document.getElementById('mask');
  var $sheet = document.getElementById('sheet');
  var $search = document.getElementById('search');
  var $searchBox = document.getElementById('searchBox');

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function currentItems() {
    var q = state.q.trim().toLowerCase();
    var lf = state.lensFor;
    var list = items.filter(function (it) {
      if (state.cat === 'fav') {
        if (!favHas(it)) return false;
      } else if (state.cat !== 'all' && it.cat !== state.cat) return false;
      if (state.brand && it.brand !== state.brand) return false;
      // 适配镜头反查（选型助手/相机详情跳转过来）：卡口 + 像面 + 解析力
      if (lf && it.cat === 'lens') {
        var mount = it.d.mount;
        var direct = lf.mounts.indexOf(mount) >= 0;
        var viaAdapter = !direct && lf.adapter && lf.adapter.indexOf(mount) >= 0;
        if (!direct && !viaAdapter) return false;
        if (lf.minIc != null && it.d.ic != null && it.d.ic < lf.minIc) return false;
        if (lf.minMp != null && it.d.mp != null && it.d.mp < lf.minMp) return false;
        if (lf.minMp != null && it.d.mp == null) return false; // 解析力未知的镜头不做反查推荐
        it._fit = direct ? 'direct' : 'adapter';
      } else if (lf) {
        return false; // 反查模式下只看镜头
      }
      var defs = FILTER_DEFS[state.cat] || [];
      for (var i = 0; i < defs.length; i++) {
        var def = defs[i], v = state.sel[selKey(def)];
        if (v === undefined || v === '') continue;
        if (def.num) {
          var n = parseFloat(v);
          var x = def.val(it);
          if (x == null) return false;
          if (def.max ? x > n : x < n) return false;
        } else {
          if (def.get(it) !== v) return false;
        }
      }
      if (q && searchText(it).indexOf(q) < 0) return false;
      return true;
    });
    if (lf && state.cat === 'lens') {
      list.sort(function (a, b) {
        return (a._fit === b._fit ? 0 : a._fit === 'direct' ? -1 : 1) ||
          (a.d.focal || 0) - (b.d.focal || 0) || String(a.d.model).localeCompare(String(b.d.model));
      });
      return list;
    }
    var sorts = SORTS[state.cat] || SORTS.all;
    var fn = sorts.filter(function (s) { return s.k === state.sort; })[0] || sorts[0];
    var arr = list.slice().sort(fn.fn);
    return arr;
  }

  // 由相机算「适配镜头」条件：卡口直配 +（大口径可转接 C 口）、像面覆盖靶面对角线、解析力 ≥ 相机像素
  function lensFitFor(camItem) {
    var d = camItem.d;
    var sw = d.sw != null ? d.sw : (d.w && d.pxUm ? d.w * d.pxUm / 1000 : null);
    var sh = d.sh != null ? d.sh : (d.h && d.pxUm ? d.h * d.pxUm / 1000 : null);
    var diag = (sw > 0 && sh > 0) ? Math.sqrt(sw * sw + sh * sh) : null;
    var mp = d.w && d.h ? d.w * d.h / 1e6 : null;
    var LARGE = ['F', 'M42', 'M58', 'M72'];
    return {
      model: d.model,
      mounts: [d.mount],
      adapter: LARGE.indexOf(d.mount) >= 0 ? ['C'] : null,
      minIc: diag != null ? Math.ceil(diag * 10) / 10 : null,
      minMp: mp != null ? Math.floor(mp * 10) / 10 : null,
      sw: sw, sh: sh, mp: mp
    };
  }

  function brandTagHtml(bk) {
    return '<span class="brand-tag"><span class="dot" style="background:' + esc(brandColor(bk)) + '"></span>' +
      esc(brandShort(bk)) + '</span>';
  }

  function colorDotHtml(text) {
    var css = '#94a3b8';
    Object.keys(COLOR_LABEL).forEach(function (k) { if (COLOR_LABEL[k] === text) css = COLOR_CSS[k]; });
    return '<span class="brand-tag"><span class="dot" style="background:' + css + '"></span>' + esc(text) + '</span>';
  }

  function renderTabs(counts) {
    $tabs.innerHTML = CATS.map(function (c) {
      var n = counts[c.key] || 0;
      return '<button class="tab' + (state.cat === c.key ? ' on' : '') + '" data-cat="' + c.key + '">' +
        esc(c.name) + '<small>' + n + '</small></button>';
    }).join('');
  }

  function renderFilters() {
    var defs = FILTER_DEFS[state.cat] || [];
    var lfBanner = '';
    if (state.lensFor && state.cat === 'lens') {
      var lf = state.lensFor;
      lfBanner = '<div class="lf-banner">🔎 <b>适配镜头反查</b>：' + esc(lf.model) +
        '　卡口 ' + esc(lf.mounts.join(' / ')) + (lf.adapter ? ' + 转接 C 口' : '') +
        (lf.minIc != null ? '　像面 ≥ ' + lf.minIc + ' mm' : '') +
        (lf.minMp != null ? '　解析 ≥ ' + lf.minMp + ' MP' : '') +
        '<button class="lf-close" id="lfClear">取消反查</button></div>';
    }
    var html = lfBanner + '<div class="f-group"><label>品牌</label><div class="f-chips" id="brandChips">';
    var brandKeys = (window.BRAND_KEYS || Object.keys(window.BRANDS || {}));
    html += '<button class="chip' + (state.brand === '' ? ' on' : '') + '" data-brand="">全部</button>';
    brandKeys.forEach(function (bk) {
      html += '<button class="chip' + (state.brand === bk ? ' on' : '') + '" data-brand="' + bk + '">' +
        esc(brandShort(bk)) + '</button>';
    });
    html += '</div></div>';
    defs.forEach(function (def) {
      if (def.num) {
        html += '<div class="f-group"><label>' + esc(def.label) + '</label>' +
          '<input class="f-num" type="number" inputmode="decimal" min="0" step="any" placeholder="不限" data-num="' + esc(def.k) + '" value="' + esc(state.sel[selKey(def)] || '') + '" /></div>';
      } else {
        // 选项由当前（品牌/搜索过滤前）数据统计，保持类别内稳定
        var opts = [];
        var seen = {};
        items.forEach(function (it) {
          if (state.cat !== 'all' && it.cat !== state.cat) return;
          if (state.brand && it.brand !== state.brand) return;
          var v = def.get(it);
          if (v != null && !seen[v]) { seen[v] = 1; opts.push(v); }
        });
        opts.sort(function (a, b) { return String(a).localeCompare(String(b), 'zh-CN'); });
        var cur = state.sel[selKey(def)] || '';
        html += '<div class="f-group"><label>' + esc(def.label) + '</label><select data-sel="' + esc(def.k) + '">' +
          '<option value="">全部</option>' +
          opts.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
          '</select></div>';
      }
    });
    var sorts = SORTS[state.cat] || SORTS.all;
    if (sorts.length > 1) {
      html += '<div class="f-group"><label>排序</label><select id="sortSel">' +
        sorts.map(function (s) { return '<option value="' + s.k + '"' + (state.sort === s.k ? ' selected' : '') + '>' + esc(s.t) + '</option>'; }).join('') +
        '</select></div>';
    }
    html += '<button class="f-reset" id="resetBtn">重置筛选</button>';
    $filters.innerHTML = html;
  }

  function cmpInList(it) {
    return state.compare.indexOf(it) >= 0 ? ' checked' : '';
  }

  function favBtnHtml(it, idx, extra) {
    var on = favHas(it);
    return '<button class="fav-btn' + (extra ? ' ' + extra : '') + (on ? ' on' : '') + '" data-fav="' + idx + '"' +
      ' title="' + (on ? '取消收藏' : '收藏（可在自定义搭配页直接选取）') + '" aria-pressed="' + on + '">' +
      (on ? '★' : '☆') + '</button>';
  }

  function renderTable(list, pageSlice) {
    var cols = COLS[state.cat] || COLS.all;
    if (state.lensFor && state.cat === 'lens') {
      cols = cols.concat([{ h: '适配方式', get: function (it) { return it._fit === 'direct' ? '直连' : '转接环'; }, fit: true }]);
    }
    $thead.innerHTML = '<th class="fav-col" title="收藏">☆</th><th class="cmp-col">对比</th>' + cols.map(function (c) {
      return '<th' + (c.cls === 'num' ? ' class="num"' : '') + '>' + esc(c.h) + '</th>';
    }).join('');
    $tbody.innerHTML = pageSlice.map(function (it) {
      return '<tr data-idx="' + list.indexOf(it) + '">' +
        '<td class="fav-col">' + favBtnHtml(it, list.indexOf(it)) + '</td>' +
        '<td class="cmp-col"><input type="checkbox" class="cmp-box" data-idx="' + list.indexOf(it) + '"' + cmpInList(it) +
          ' title="加入横向对比（最多 4 个）" /></td>' +
        cols.map(function (c) {
        if (c.art) return '<td class="art-cell">' + artFor(it) + '</td>';
        if (c.fit) {
          return '<td>' + (it._fit === 'direct'
            ? '<span class="fit-tag direct">直连</span>'
            : '<span class="fit-tag adapter">需转接环</span>') + '</td>';
        }
        if (c.brand) return '<td>' + brandTagHtml(it.brand) + '</td>';
        if (c.color) { var t = c.get(it); return '<td>' + (t ? colorDotHtml(t) : '<span class="muted-cell">—</span>') + '</td>'; }
        var v = c.get(it);
        var cls = (c.cls ? ' class="' + c.cls + '"' : '') + (c.dim ? ' dim' : '');
        if (c.tag === 'brand') return '<td' + cls + '>' + brandTagHtml(it.brand) + '</td>';
        return '<td' + cls + '>' + (v !== null && v !== undefined && v !== '' ? esc(v) : '<span class="muted-cell">—</span>') + '</td>';
      }).join('') + '</tr>';
    }).join('');
  }

  function renderCards(pageSlice, list) {
    $cards.innerHTML = pageSlice.map(function (it) {
      var model = it.d.model || it.d.series || '';
      var specs = cardSpecs(it);
      var fitTag = (state.lensFor && it.cat === 'lens')
        ? '<span class="fit-tag ' + (it._fit === 'direct' ? 'direct">直连' : 'adapter">需转接环') + '</span>' : '';
      return '<div class="card" data-idx="' + list.indexOf(it) + '">' +
        '<div class="card-flex"><div class="card-art">' + artFor(it) + '</div>' +
        '<div class="card-main">' +
        '<div class="card-head"><span class="card-model">' + esc(model) + '</span>' + brandTagHtml(it.brand) + fitTag +
        favBtnHtml(it, list.indexOf(it), 'card-fav') +
        '<label class="cmp-chip"><input type="checkbox" class="cmp-box" data-idx="' + list.indexOf(it) + '"' + cmpInList(it) + ' />对比</label>' +
        '</div>' +
        '<div class="card-specs">' + specs.map(function (p) {
          return '<span class="spec"><span class="k">' + esc(p[0]) + '</span>' +
            '<span class="v">' + (p[1] != null && p[1] !== '' ? esc(p[1]) : '—') + '</span></span>';
        }).join('') + '</div></div></div></div>';
    }).join('');
  }

  function cardSpecs(it) {
    var d = it.d;
    if (it.cat === 'cam') return [
      ['分辨率', resText(d) || '—'], ['像素', mpText(d) || '—'],
      ['像元', d.pxUm != null ? d.pxUm + ' µm' : '—'], ['帧率', d.fps != null ? d.fps + ' fps' : '—'],
      ['接口', d.iface || '—'], ['彩色', d.color || '—'],
      ['靶面', d.size || '—'], ['卡口', mountText(d.mount) || '—']
    ];
    if (it.cat === 'line') return [
      ['行宽', d.w != null ? d.w + ' px' : '—'], ['行频', (d.lineRateMax || d.lineRate) != null ? (d.lineRateMax || d.lineRate) + ' kHz' : '—'],
      ['像元', d.pxH != null ? d.pxH + ' µm' : '—'], ['接口', d.iface || '—'],
      ['彩色', d.color || '—'], ['卡口', mountText(d.mount) || '—']
    ];
    if (it.cat === 'lens') return [
      ['焦距', d.focal != null ? d.focal + ' mm' : '—'], ['光圈', d.fmin != null ? 'F' + d.fmin + '–' + d.fmax : '—'],
      ['靶面', d.fmt || '—'], ['卡口', mountText(d.mount) || '—'],
      ['像素', d.mp != null ? d.mp + ' MP' : '—'], ['最近工作距离', d.minDist != null ? d.minDist + ' m' : '—']
    ];
    if (it.cat === 'tele') return [
      ['型号规则', d.model || '—'], ['倍率', d.magMin != null ? d.magMin + '×–' + d.magMax + '×' : '—'],
      ['工作距离', d.wdMin != null ? d.wdMin + '–' + d.wdMax + ' mm' : '—'], ['靶面', d.fmt || '—'],
      ['卡口', mountText(d.mount) || '—'], ['同轴', d.coax ? '支持' : '—']
    ];
    if (it.cat === 'light') return [
      ['类型', lightTypeText(d.type)], ['颜色', lightColorText(d.color) || '—'],
      ['尺寸', fmtSize(d.size, d.type) || '—'], ['功率', d.power != null ? d.power + ' W' : '—'],
      ['角度', d.angle != null ? d.angle + '°' : '—']
    ];
    if (it.cat === 'ctrl') return [
      ['通道', d.channels != null ? d.channels + ' 通道' : '—'], ['频闪', d.strobe ? '支持' : '—'],
      ['调光', d.mode || '—']
    ];
    if (it.cat === 'prof') {
      if (d.kind === 'profiler') return [
        ['子类', profKind(d)], ['单轮廓点数', d.points != null ? d.points + ' 点' : '—'],
        ['测量范围 X×Z', d.xRange && d.zRange ? d.xRange + ' × ' + d.zRange : '—'],
        ['参考距离', d.ref || '—'], ['Z 分辨率', d.zRes || '—'],
        ['Z 重复精度', d.zRepeat || '—'], ['行频', d.rate || '—'], ['激光', d.laser || '—']
      ];
      return [
        ['子类', profKind(d)], ['视场', d.fov || '—'], ['工作范围', d.work || '—'],
        ['精度', d.accuracy || '—'], ['帧率', d.fps || '—'], ['接口', d.iface || '—']
      ];
    }
    if (it.cat === 'ipc') {
      if (d.series === '工控主板') return [
        ['子类', d.series], ['芯片组', d.chipset || '—'], ['处理器', d.cpu || '—'],
        ['内存', d.ram || '—'], ['网口', d.lan || '—'], ['扩展', d.exp || '—'],
        ['尺寸', d.form || '—']
      ];
      return [
        ['子类', d.series], ['适用主板', d.board || '—'], ['扩展槽位', d.io || '—'],
        ['硬盘位', d.bays || '—'], ['机箱尺寸', d.size || '—']
      ];
    }
    return [];
  }

  var filtered = [];
  function render() {
    filtered = currentItems();
    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * PAGE_SIZE;
    var slice = filtered.slice(start, start + PAGE_SIZE);

    renderTable(filtered, slice);
    renderCards(slice, filtered);

    $result.innerHTML = (state.cat === 'fav' && !favLoad().length)
      ? '还没有收藏：点列表行首（手机在型号旁）的 <b>☆</b> 或在详情里点「☆ 收藏」，收藏后会出现在自定义搭配页的选择器里。'
      : '共 <b>' + filtered.length + '</b> 条结果' +
      (state.q ? '（关键词「' + esc(state.q.trim()) + '」）' : '') +
      (isMobile.matches ? '，点卡片看全参数' : '，点行查看全参数');

    $pgInfo.textContent = '第 ' + state.page + ' / ' + totalPages + ' 页 · 每页 ' + PAGE_SIZE + ' 条';
    $pgPrev.disabled = state.page <= 1;
    $pgNext.disabled = state.page >= totalPages;
  }

  function renderAll() {
    // 类别计数（只按类别，不受筛选影响，便于导航）
    var counts = { all: items.length, fav: favLoad().length };
    items.forEach(function (it) { counts[it.cat] = (counts[it.cat] || 0) + 1; });
    renderTabs(counts);
    renderFilters();
    render();
  }

  function switchCat(cat) {
    state.cat = cat;
    state.page = 1;
    if (cat !== 'lens' && state.lensFor) state.lensFor = null; // 反查模式只在镜头页生效
    var sorts = SORTS[cat] || SORTS.all;
    state.sort = sorts[0].k;
    renderAll();
  }

  /* ============ 5. 详情弹层 ============ */
  function openDetail(it) {
    var d = it.d;
    var catInfo = CATS.filter(function (x) { return x.key === it.cat; })[0];
    var logo = brandLogo(it.brand);
    var meta = metas[it.brand] || {};
    var rows = (DETAIL[it.cat] || []).map(function (p) {
      var v = p[1](d);
      if (v === null || v === undefined || v === '') return '';
      return '<tr><td class="k">' + esc(p[0]) + '</td><td class="v">' + esc(v) + '</td></tr>';
    }).join('');
    $sheet.innerHTML =
      '<div class="sheet-head"><div class="row1">' +
        (logo ? '<img class="sheet-logo" src="' + esc(logo) + '" alt="' + esc(brandShort(it.brand)) + '" />' : '') +
        '<span class="cat-tag">' + esc(catInfo ? catInfo.catName : '') + '</span>' +
        (comboSupported(it)
          ? '<button class="inq-add combo-add' + (comboSame(it) ? ' on' : '') + '" id="comboAdd">' +
            (comboSame(it) ? '✓ 已在搭配台' : '＋ 加入搭配') + '</button>'
          : '') +
        '<button class="inq-add fav-add' + (favHas(it) ? ' on' : '') + '" id="favAdd">' +
          (favHas(it) ? '★ 已收藏' : '☆ 收藏') + '</button>' +
        '<button class="inq-add" id="inqAdd">' + (inquiryHas(d.model || d.series || '') ? '✓ 已在清单' : '＋ 询价清单') + '</button>' +
        '<button class="sheet-close" id="sheetClose">✕</button>' +
      '</div>' +
      '<div class="sheet-model">' + esc(d.model || d.series || '') + '</div>' +
      '<div class="sheet-meta"><span>' + esc(brandShort(it.brand)) + '</span>' +
        (meta.generated ? '<span>数据来源：' + esc(meta.source || '') + '（' + esc(meta.generated) + '）</span>' : '') +
      '</div></div>' +
      '<div class="sheet-art">' + artFor(it) + '</div>' +
      '<table class="kv-table">' + rows + '</table>' + extraBlocks(it);
    $mask.classList.add('show');
    document.getElementById('sheetClose').addEventListener('click', closeDetail);
    var addBtn = document.getElementById('inqAdd');
    if (addBtn) addBtn.addEventListener('click', function () {
      var model2 = it.d.model || it.d.series || '';
      if (inquiryHas(model2)) {
        inquiryRemove(model2);
        addBtn.textContent = '＋ 询价清单';
        addBtn.classList.remove('on');
      } else {
        inquiryAdd({ m: model2, b: it.brand, c: it.cat });
        addBtn.textContent = '✓ 已在清单';
        addBtn.classList.add('on');
      }
      renderInquiryTray();
    });
    var comboBtn = document.getElementById('comboAdd');
    if (comboBtn) comboBtn.addEventListener('click', function () {
      var on = comboToggle(it);
      comboBtn.textContent = on ? '✓ 已在搭配台' : '＋ 加入搭配';
      comboBtn.classList.toggle('on', on);
    });
    var favBtn = document.getElementById('favAdd');
    if (favBtn) favBtn.addEventListener('click', function () {
      var on = favToggle(it);
      favBtn.textContent = on ? '★ 已收藏' : '☆ 收藏';
      favBtn.classList.toggle('on', on);
      renderAll();
    });
    bindDetailExtras(it);
  }

  // 详情弹层附加块：相机的「适配镜头反查」入口 + 相机/镜头的跨品牌等价列表 + 光源的适配控制器
  function extraBlocks(it) {
    var html = '';
    if (it.cat === 'cam') {
      html += '<div class="x-block"><button class="x-btn" id="xLensFit">🔎 查看适配镜头（卡口 + 像面 + 解析力反查）</button></div>';
    }
    if (it.cat === 'light') {
      // 适配控制器：同品牌优先全部列出，无同品牌再跨品牌
      var sameBrand = items.filter(function (x) { return x.cat === 'ctrl' && x.brand === it.brand; });
      var others = items.filter(function (x) { return x.cat === 'ctrl' && x.brand !== it.brand; });
      var ctrls = sameBrand.length ? sameBrand : others;
      if (ctrls.length) {
        html += '<div class="x-block"><div class="x-title">适配控制器（' + (sameBrand.length ? '同品牌' : '同品牌无，跨品牌') + ' ' + ctrls.length + ' 款）' +
          '<span class="x-note">电压与通道匹配优先同品牌</span></div>' +
          '<div class="x-list">' + ctrls.map(function (x) {
            var idx = items.indexOf(x);
            return '<button class="x-item" data-open="' + idx + '">' + artFor(x) +
              '<span class="x-model">' + esc(x.d.model) + '</span>' +
              '<span class="fit-tag direct">' + (x.d.channels || '?') + ' 通道' + (x.d.strobe ? ' · 频闪' : '') + '</span></button>';
          }).join('') + '</div></div>';
      }
    }
    var eq = crossBrandEquiv(it);
    if (eq.length) {
      html += '<div class="x-block"><div class="x-title">跨品牌等价型号（' + eq.length + '）' +
        '<span class="x-note">' + (it.cat === 'cam' ? '同分辨率 + 接口 + 彩色' : '同卡口 + 焦距 ±12%') + '</span></div>' +
        '<div class="x-list">' + eq.map(function (x) {
          var idx = items.indexOf(x);
          return '<button class="x-item" data-open="' + idx + '">' + artFor(x) +
            '<span class="x-model">' + esc(x.d.model) + '</span>' + brandTagHtml(x.brand) + '</button>';
        }).join('') + '</div></div>';
    }
    return html;
  }

  // 跨品牌等价：相机 = 同 w/h + 接口 + 彩色；镜头 = 同卡口 + 焦距 ±12%
  function crossBrandEquiv(it) {
    if (it.cat === 'cam') {
      var d = it.d;
      return items.filter(function (x) {
        return x !== it && x.cat === 'cam' && x.d.w === d.w && x.d.h === d.h &&
          x.d.iface === d.iface && x.d.color === d.color;
      });
    }
    if (it.cat === 'lens' && it.d.focal) {
      return items.filter(function (x) {
        return x !== it && x.cat === 'lens' && x.d.mount === it.d.mount && x.d.focal &&
          Math.abs(x.d.focal - it.d.focal) / it.d.focal <= 0.12;
      });
    }
    return [];
  }

  function bindDetailExtras(it) {
    var btn = document.getElementById('xLensFit');
    if (btn) btn.addEventListener('click', function () {
      state.lensFor = lensFitFor(it);
      state.q = '';
      $search.value = '';
      $searchBox.classList.remove('has-val');

      state.brand = '';
      state.page = 1;
      closeDetail();
      switchCat('lens');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    [...document.querySelectorAll('.x-item')].forEach(function (b) {
      b.addEventListener('click', function () {
        var target = items[parseInt(b.getAttribute('data-open'), 10)];
        if (target) openDetail(target);
      });
    });
  }

  function closeDetail() { $mask.classList.remove('show'); }
  $mask.addEventListener('click', function (e) { if (e.target === $mask) closeDetail(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });

  /* ============ 6. 事件绑定 ============ */
  $tabs.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (btn) switchCat(btn.getAttribute('data-cat'));

  $filters.addEventListener('click', function (e) {

  $filters.addEventListener('change', function (e) {

      state.sel[state.cat + '.' + t.getAttribute('data-sel')] = t.value;

    } else if (t.id === 'sortSel') {

  $filters.addEventListener('input', function (e) {

  var searchTimer = null;
  $search.addEventListener('input', function () {
    $searchBox.classList.toggle('has-val', !!$search.value);

    searchTimer = setTimeout(function () {

      state.page = 1;

    }, 120);
  });
  document.getElementById('searchClear').addEventListener('click', function () {
    $search.value = '';
    $searchBox.classList.remove('has-val');
    state.q = '';
    state.page = 1;
    render();
    $search.focus();
  });

  $pgPrev.addEventListener('click', function () { if (state.page > 1) { state.page--; render(); } });
  $pgNext.addEventListener('click', function () {

    if (state.page < tp) { state.page++; render(); }
  });
  if (isMobile.addEventListener) isMobile.addEventListener('change', render);
  else isMobile.addListener(render);

  function rowClick(e) {
    if (e.target.closest('.cmp-box, .cmp-chip, .fav-btn')) return; // 对比勾选 / 收藏不触发详情
    var el = e.target.closest('[data-idx]');

  function favClick(e) {

  $tbody.addEventListener('click', favClick);

  /* ---- 横向对比 ---- */
  function toggleCompare(idx) {
    var it = filtered[parseInt(idx, 10)];
    if (!it) return;
    var i = state.compare.indexOf(it);
    if (i >= 0) state.compare.splice(i, 1);
    else if (state.compare.length >= 4) return; // 最多 4 个
    else if (state.compare.length && state.compare[0].cat !== it.cat) return; // 仅同类可比
    else state.compare.push(it);
    renderCompareTray();
    render();
  }
  function cmpCat() { return state.compare.length ? state.compare[0].cat : null; }

  function renderCompareTray() {
    var tray = document.getElementById('cmpTray');
    if (!state.compare.length) { tray.className = 'cmp-tray'; tray.innerHTML = ''; return; }
    var catName = (CATS.filter(function (x) { return x.key === cmpCat(); })[0] || {}).catName || '';
    tray.className = 'cmp-tray show';
    tray.innerHTML =
      '<span>对比 ' + state.compare.length + '/4 · ' + esc(catName) + '</span>' +
      '<span class="t-models">' + esc(state.compare.map(function (x) { return x.d.model || x.d.series; }).join('、')) + '</span>' +
      (state.compare.length >= 2 ? '<button class="t-go" id="cmpGo">开始对比</button>' : '') +
      '<button class="t-clear" id="cmpClear">清空</button>';
    document.getElementById('cmpGo') && document.getElementById('cmpGo').addEventListener('click', openCompare);
    document.getElementById('cmpClear').addEventListener('click', function () {
      state.compare = [];
      renderCompareTray();
      render();
    });
  }

  function openCompare() {
    var its = state.compare;
    if (its.length < 2) return;
    var cat = its[0].cat;
    var catInfo = CATS.filter(function (x) { return x.key === cat; })[0];
    var fields = DETAIL[cat] || [];
    var vals = its.map(function (it) {
      return fields.map(function (p) {
        var v = p[1](it.d);
        return (v === null || v === undefined || v === '') ? '—' : String(v);
      });
    });
    var headRow = '<tr><td class="k"></td>' + its.map(function (it) {
      return '<th><div class="card-model" style="font-size:12.5px">' + esc(it.d.model || it.d.series || '') + '</div>' +
        '<div style="margin-top:4px">' + brandTagHtml(it.brand) + '</div></th>';
    }).join('') + '</tr>';
    var body = fields.map(function (p, fi) {
      var diff = its.length > 1 && vals.some(function (v) { return v[fi] !== vals[0][fi]; });
      return '<tr><td class="k">' + esc(p[0]) + '</td>' + vals.map(function (v) {
        return '<td' + (diff ? ' class="diff"' : '') + '>' + esc(v[fi]) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    $sheet.className = 'sheet sheet-wide';
    $sheet.innerHTML =
      '<div class="sheet-head"><div class="row1">' +
        '<span class="cat-tag">横向对比 · ' + esc(catInfo ? catInfo.catName : '') + ' · ' + its.length + ' 个</span>' +
        '<button class="sheet-close" id="sheetClose">✕</button>' +
      '</div>' +
      '<div class="sheet-meta"><span>黄色底 = 参数不同的行</span></div></div>' +
      '<div style="overflow-x:auto"><table class="cmp-table"><thead>' + headRow + '</thead><tbody>' + body + '</tbody></table></div>';
    $mask.classList.add('show');
    document.getElementById('sheetClose').addEventListener('click', function () {
      closeDetail();
      $sheet.className = 'sheet';
    });
  }
  document.addEventListener('change', function (e) {
    if (e.target.classList && e.target.classList.contains('cmp-box')) {
      toggleCompare(e.target.getAttribute('data-idx'));
    }
  });

  /* ---- 搭配台（与 combo.html 共用 vs-combo） ---- */
  var COMBO_KEY = 'vs-combo';
  var COMBO_NAMES = { camera: '相机', lens: '镜头', light: '光源' };
  function comboLoad() {
    try { return JSON.parse(localStorage.getItem(COMBO_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function comboSave(o) {
    try { localStorage.setItem(COMBO_KEY, JSON.stringify(o)); } catch (e) { /* 隐私模式等场景忽略 */ }
  }
  function comboSlotOf(cat) {
    return cat === 'cam' ? 'camera' : (cat === 'lens' ? 'lens' : (cat === 'light' ? 'light' : null));
  }
  // 搭配页只合并主目录里的光源（Basler 灯光独立库暂未并入选型引擎）
  function comboSupported(it) {
    if (!comboSlotOf(it.cat)) return false;
    if (it.cat !== 'light') return true;
    var gs = ['HikrobotCatalog', 'HuaruiCatalog', 'BaslerCatalog', 'DahengCatalog'];
    for (var i = 0; i < gs.length; i++) {
      var c = window[gs[i]];
      if (c && (c.LIGHTS || []).indexOf(it.d) >= 0) return true;
    }
    return false;
  }
  function comboBrandKey(b) {
    if (!b) return null;
    if (BRANDS[b]) return b;
    var ks = Object.keys(BRANDS);
    for (var i = 0; i < ks.length; i++) {
      var m = BRANDS[ks[i]];
      if (!m) continue;
      if (m.name === b || m.short === b || String(m.key).toLowerCase() === String(b).toLowerCase()) return ks[i];
      if (String(b).indexOf(m.short) >= 0) return ks[i];
    }
    return b;
  }
  function comboModel(it) { return it.d.model || it.d.series || ''; }
  function comboSame(it) {
    var slot = comboSlotOf(it.cat);
    if (!slot) return false;
    var cur = comboLoad()[slot];
    return !!cur && comboBrandKey(cur.b) === comboBrandKey(it.brand) && cur.m === comboModel(it);
  }
  function comboToggle(it) {
    var slot = comboSlotOf(it.cat);
    if (!slot || !comboSupported(it)) return false;
    var o = comboLoad();
    if (o[slot] && comboBrandKey(o[slot].b) === comboBrandKey(it.brand) && o[slot].m === comboModel(it)) {
      delete o[slot];
    } else {
      o[slot] = { b: it.brand, m: comboModel(it) };
    }
    comboSave(o);
    renderComboTray();
    return !!o[slot];
  }
  function renderComboTray() {
    var tray = document.getElementById('comboTray');
    if (!tray) return;
    var o = comboLoad();
    var parts = [];
    ['camera', 'lens', 'light'].forEach(function (k) {
      if (o[k] && o[k].m) parts.push(COMBO_NAMES[k] + ' ' + o[k].m);
    });
    if (!parts.length) { tray.className = 'cmp-tray combo-tray'; tray.innerHTML = ''; return; }
    tray.className = 'cmp-tray combo-tray show';
    tray.innerHTML =
      '<span>🧩 搭配台 ' + parts.length + '/3</span>' +
      '<span class="t-models">' + esc(parts.join(' · ')) + '</span>' +
      '<a class="t-go" href="combo.html">去评定 →</a>' +
      '<button class="t-clear" id="comboClear">清空</button>';
    document.getElementById('comboClear').addEventListener('click', function () {
      comboSave({});
      renderComboTray();
    });
  }

  /* ---- 收藏（与自定义搭配页共用 vs-fav，搭配页选择器里直接列出） ---- */
  var FAV_KEY = 'vs-fav';
  function favLoad() {
    try { var v = JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function favSave(list) {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch (e) { /* 隐私模式等场景忽略 */ }
  }
  function favKeyOf(it) {
    return (comboBrandKey(it.brand) || '') + '::' + comboModel(it);
  }
  function favHas(it) {
    var k = favKeyOf(it);
    return favLoad().some(function (x) { return (x.b || '') + '::' + x.m === k; });
  }
  function favToggle(it) {
    var k = favKeyOf(it), list = favLoad(), on = true;
    var rest = list.filter(function (x) { return (x.b || '') + '::' + x.m !== k; });
    if (rest.length === list.length) rest.push({ b: comboBrandKey(it.brand), m: comboModel(it), c: it.cat });
    else on = false;
    favSave(rest);
    return on;
  }

  /* ---- 询价清单（localStorage 持久化，仅本机） ---- */
  var INQ_KEY = 'vs-inquiry-list';
  function inquiryLoad() {
    try { return JSON.parse(localStorage.getItem(INQ_KEY) || '[]'); } catch (e) { return []; }
  }
  function inquirySave(list) {
    try { localStorage.setItem(INQ_KEY, JSON.stringify(list)); } catch (e) { /* 隐私模式等场景忽略 */ }
  }
  function inquiryHas(model) { return inquiryLoad().some(function (x) { return x.m === model; }); }
  function inquiryAdd(rec) {
    var list = inquiryLoad();
    if (!list.some(function (x) { return x.m === rec.m; })) { list.push(rec); inquirySave(list); }
  }
  function inquiryRemove(model) {
    inquirySave(inquiryLoad().filter(function (x) { return x.m !== model; }));
  }
  function inquiryItem(rec) {
    // 由 {m,b,c} 找回完整 item（型号可能重复出现在多库，按品牌优先匹配）
    var cands = items.filter(function (x) { return (x.d.model || x.d.series) === rec.m; });
    return cands.filter(function (x) { return x.brand === rec.b; })[0] || cands[0] || null;
  }
  function renderInquiryTray() {
    var tray = document.getElementById('inqTray');
    var list = inquiryLoad();
    if (!list.length) { tray.className = 'cmp-tray inquiry-tray'; tray.innerHTML = ''; return; }
    tray.className = 'cmp-tray inquiry-tray show';
    tray.innerHTML =
      '<span>🧾 询价清单 ' + list.length + ' 项</span>' +
      '<button class="t-go" id="inqOpen">查看</button>';
    document.getElementById('inqOpen').addEventListener('click', openInquiryPanel);
  }
  function openInquiryPanel() {
    var list = inquiryLoad();
    if (!list.length) return;
    var rows = list.map(function (rec, i) {
      var it = inquiryItem(rec);
      var catName = (CATS.filter(function (x) { return x.key === rec.c; })[0] || {}).catName || '';
      var specs = it ? keySpecText(it) : '';
      return '<tr><td class="k">' + esc(catName) + '</td>' +
        '<td><b>' + esc(rec.m) + '</b>　' + brandTagHtml(rec.b) +
        (specs ? '<br><span style="color:var(--muted);font-size:11.5px">' + esc(specs) + '</span>' : '') + '</td>' +
        '<td style="white-space:nowrap;text-align:right">' +
        (it ? '<button class="x-mini" data-open-item="' + i + '">详情</button>' : '') +
        '<button class="x-mini danger" data-rm="' + i + '">移除</button></td></tr>';
    }).join('');
    $sheet.className = 'sheet sheet-wide sheet-inq';
    $sheet.innerHTML =
      '<div class="sheet-head"><div class="row1">' +
        '<span class="cat-tag">询价清单 · ' + list.length + ' 项</span>' +
        '<button class="sheet-close" id="sheetClose">✕</button>' +
      '</div>' +
      '<div class="sheet-meta"><span>保存在本机浏览器（localStorage），换设备不跟随</span></div></div>' +
      '<div style="overflow-x:auto"><table class="cmp-table"><thead><tr><td class="k">类别</td><th>型号</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="inq-actions">' +
        '<button class="x-btn inq-copy" id="inqCopy">复制清单文本</button>' +
        '<button class="x-btn inq-clear" id="inqClear">清空</button>' +
      '</div>';
    $mask.classList.add('show');
    document.getElementById('sheetClose').addEventListener('click', function () {
      closeDetail(); $sheet.className = 'sheet';
    });
    Array.prototype.forEach.call($sheet.querySelectorAll('[data-rm]'), function (b) {
      b.addEventListener('click', function () {
        var list2 = inquiryLoad();
        list2.splice(parseInt(b.getAttribute('data-rm'), 10), 1);
        inquirySave(list2);
        renderInquiryTray();
        if (list2.length) openInquiryPanel(); else { closeDetail(); $sheet.className = 'sheet'; }
      });
    });
    Array.prototype.forEach.call($sheet.querySelectorAll('[data-open-item]'), function (b) {
      b.addEventListener('click', function () {
        var rec = inquiryLoad()[parseInt(b.getAttribute('data-open-item'), 10)];
        var it = rec && inquiryItem(rec);
        if (it) { $sheet.className = 'sheet'; openDetail(it); }
      });
    });
    document.getElementById('inqClear').addEventListener('click', function () {
      inquirySave([]);
      renderInquiryTray();
      closeDetail(); $sheet.className = 'sheet';
    });
    document.getElementById('inqCopy').addEventListener('click', function () {
      var lines = ['询价清单（机器视觉选型工具集 · ' + new Date().toLocaleDateString('zh-CN') + '）', ''];
      inquiryLoad().forEach(function (rec) {
        var it = inquiryItem(rec);
        var catName = (CATS.filter(function (x) { return x.key === rec.c; })[0] || {}).catName || '';
        lines.push('· [' + catName + '] ' + rec.m + '（' + brandShort(rec.b) + '）' + (it && keySpecText(it) ? ' — ' + keySpecText(it) : ''));
      });
      lines.push('', '共 ' + inquiryLoad().length + ' 项；参数以厂商最新资料为准。');
      var txt = lines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () {
          var b = document.getElementById('inqCopy');
          b.textContent = '✓ 已复制';
          setTimeout(function () { b.textContent = '复制清单文本'; }, 1500);
        }, function () { window.prompt('复制下面的清单文本：', txt); });
      } else {
        window.prompt('复制下面的清单文本：', txt);
      }
    });
  }

  /* ---- 键盘翻页：列表页按 ←/→ 翻页（输入框聚焦或弹层打开时忽略） ---- */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if ($mask.classList.contains('show')) return;
    var t = e.target;
    if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
    if (e.key === 'ArrowLeft' && !$pgPrev.disabled) { state.page--; render(); }
    if (e.key === 'ArrowRight' && !$pgNext.disabled) { state.page++; render(); }
  });

  /* ============ 7. 顶部统计与页脚 ============ */
  (function initStats() {
    var total = items.length;
    var cam = items.filter(function (x) { return x.cat === 'cam'; }).length;
    var lens = items.filter(function (x) { return x.cat === 'lens'; }).length;
    var light = items.filter(function (x) { return x.cat === 'light'; }).length;
    var prof = items.filter(function (x) { return x.cat === 'prof'; }).length;
    var ipc = items.filter(function (x) { return x.cat === 'ipc'; }).length;
    document.getElementById('stats').innerHTML =
      '共收录 <b>' + total + '</b> 个型号：面阵相机 <b>' + cam + '</b> · 镜头 <b>' + lens + '</b> · 光源 <b>' + light +
      '</b> · 3D 传感器 <b>' + prof + '</b> · 工控机 <b>' + ipc + '</b> 等，来自海康机器人 / 华睿 / Basler / 大恒图像 官方型录与官网数据。';
    var footLines = [];
    allMetas.forEach(function (m) {
      footLines.push(brandShort(m.brand) + '：' + (m.meta.source || '') + (m.meta.generated ? '（更新于 ' + m.meta.generated + '）' : ''));
    });
    document.getElementById('foot').innerHTML =
      '<b>数据来源</b><br>' + footLines.map(esc).join('<br>') +
      '<br>本页面为选型助手的配套产品库，纯前端实现，可离线使用；参数以厂商官方最新资料为准。';
  })();

  renderAll();

  renderInquiryTray();
  renderComboTray();

  /* ============ 8. URL 参数入口：?cat=cam&q=型号 → 自动定位并弹出详情 ============ */
  (function initFromUrl() {
    try {
      var sp = new URLSearchParams(location.search);
      var q = sp.get('q'), cat = sp.get('cat');
      if (cat && CATS.some(function (c) { return c.key === cat; }) && cat !== state.cat) {
        state.cat = cat;
        state.sort = (SORTS[cat] || SORTS.all)[0].k;
      }
      if (q) {
        state.q = q;
        $search.value = q;
        $searchBox.classList.add('has-val');
        renderAll();
        var exact = filtered.filter(function (it) { return (it.d.model || '') === q; });
        if (exact.length) openDetail(exact[0]);
      } else if (cat) {
        renderAll();
      }
    } catch (e) { /* URL 解析失败不影响正常使用 */ }
  })();
})();
</script>
</body>
</html>
