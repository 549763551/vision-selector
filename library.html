<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>产品库 · 机器视觉选型助手</title>
<meta name="description" content="六品牌机器视觉产品库：面阵 / 线阵相机、镜头、远心镜头、光源与控制器、3D 传感器、工控机、红外相机全量型号，支持分类筛选、关键词查询与全参数查看，手机 / 电脑均可使用。" />
<link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
<link rel="icon" href="assets/favicon.ico" />
<link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
<link rel="stylesheet" href="common.css" />
<style>

  /* ---------- 顶栏 ---------- */
  /* 与主页一致：纯深蓝 #0d2745、无青线 */
  .topbar { background: #0d2745; color: #fff; padding: 12px 32px; }
  .topbar-inner { max-width: 1200px; margin: 0 auto; }
  .tb-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tb-title { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .tb-title small { display: block; font-weight: 400; font-size: 12px; color: rgba(255,255,255,.55); margin: 3px 0 0; }
  /* ---------- 全站导航（与选型助手 / 自定义搭配同一套） ---------- */
  .tb-stats { margin-top: 10px; font-size: 13.5px; color: #93a4bd; }
  .tb-stats b { color: #fff; font-weight: 600; }
  .tb-search { margin-top: 14px; position: relative; max-width: 620px; }
  .tb-search input {
    width: 100%; padding: 13px 42px 13px 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.10); color: #fff; font-size: 14px; font-family: inherit; outline: none;
  }
  .tb-search input::placeholder { color: #8fa2bd; }
  .tb-search input:focus { border-color: rgba(56,189,248,.6); background: rgba(255,255,255,.14); }
  .tb-search .s-ico {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #8fa2bd; font-size: 14px; pointer-events: none;
  }
  .tb-search .s-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: rgba(255,255,255,.14); color: #d7e3f4; width: 24px; height: 24px;
    border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1; display: none;
  }
  .tb-search.has-val .s-clear { display: block; }

  /* ---------- 类别标签 ---------- */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 28px 60px; }
  /* 类别页签：圆润胶囊，选中项由一块会滑动的青底托住 */
  .tabs-host { position: relative; }
  .tabs {
    display: flex; flex-wrap: wrap; gap: 6px; overflow-x: auto; padding: 0 0 7px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; z-index: 1; flex: 0 0 auto;
    border: 0; background: none; color: var(--muted);
    border-radius: 999px; padding: 8px 13px; font-size: 13.5px; font-family: inherit; cursor: pointer;
    white-space: nowrap; line-height: 1.5; transition: color .15s;
  }
  .tab small { color: var(--muted); font-size: 12.5px; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: #fff; font-weight: 500; }
  .tab.on small { color: rgba(255, 255, 255, .85); }
  .tab-ind {
    position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 0;
    background: var(--accent); border-radius: 999px; opacity: 0; pointer-events: none;
  }

  /* ---------- 筛选区 ---------- */
  .filters {
    margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
  }
  /* 传感器系列名很长（如「通用型光电传感器-EZ-A1/EZ-D/T/R/EZL-D/T/R/E系列」），
     下拉框会把筛选行撑到屏幕外，这里锁死最大宽度 */
  .f-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; max-width: 100%; }
  .f-group > label { font-size: 12.5px; color: var(--muted); }
  .f-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: #fbfdff; color: var(--ink); font-family: inherit;
    font-size: 13px; border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: all .12s;
  }
  .chip:hover { border-color: #7fb8d4; }
  .chip.on { background: var(--accent-soft); border-color: #0e7490; color: var(--accent); font-weight: 600; }
  .filters select, .filters input[type="number"], .filters input[type="text"] {
    font-family: inherit; font-size: 13.5px; color: var(--ink); background: #fbfdff;
    border: 1px solid #d6e0ea; border-radius: 8px; padding: 8px 10px; outline: none;
    min-width: 0; max-width: 100%; text-overflow: ellipsis;
  }
  .filters select:focus, .filters input:focus { border-color: #0e7490; }
  .f-num { width: 104px; }
  .f-reset {
    margin-left: auto; border: 1px solid var(--line); background: #fff; color: var(--muted);
    font-family: inherit; font-size: 13px; border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  .f-reset:hover { color: var(--danger, #dc2626); border-color: #fecaca; }
  .f-result { font-size: 13.5px; color: var(--muted); padding: 12px 2px 0; }
  .f-result b { color: var(--accent); }
  .f-result .q-note { color: #b45309; }

  /* ---------- 退市型号：标签 / 顶部提示 / 详情说明 ---------- */
  .eol-tag {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; line-height: 1.6; white-space: nowrap;
    color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; vertical-align: 1px;
  }
  .eol-tag.soft {
    color: #92400e; background: #fef3c7; border-color: #fde68a;
  }
  .eol-banner {
    margin-top: 10px; padding: 11px 14px; border-radius: 12px;
    background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
    font-size: 13.5px; line-height: 1.75;
  }
  .eol-banner b { color: #7c2d12; }
  .eol-banner.soft { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .eol-banner.soft b { color: #78350f; }
  .eol-tip { display: block; margin-top: 3px; color: #5b6b82; font-size: 12.5px; }
  .repl-chip {
    display: inline-block; margin: 0 4px; padding: 2px 10px; border-radius: 999px;
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    color: #0b4a6b; background: #eaf4fb; border: 1px solid #b6dcec;
  }
  .repl-chip:hover { background: #dbeafe; border-color: #7fb8d4; }
  .sheet-eol {
    color: #b91c1c; font-weight: 600; padding: 1px 8px; border-radius: 999px;
    background: #fee2e2; border: 1px solid #fecaca;
  }
  .sheet-eol.soft { color: #92400e; background: #fef3c7; border-color: #fde68a; }
  .eol-block {
    margin: 12px 0 4px; padding: 13px 15px; border-radius: 12px;
    background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d;
    font-size: 13.5px; line-height: 1.75;
  }
  .eol-block .eb-h { font-weight: 700; margin-bottom: 5px; font-size: 13.5px; }
  .eol-block.soft { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .eol-block.soft .eb-h { color: #b45309; }
  .eol-block.soft .eb-doc { color: #a16207; }
  .eol-block b { font-weight: 700; }
  .eol-block .eb-note { margin-top: 6px; color: #92400e; }
  .eol-block .eb-doc { margin-top: 6px; color: #9a3412; font-size: 12.5px; }
  .eol-block .eb-row { margin-top: 8px; }

  /* ---------- 未收录型号：说明 + 型号解读 + 现售替代 ---------- */
  .miss {
    margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    padding: 18px 20px 16px;
  }
  .miss[hidden] { display: none; }
  .miss-h { font-size: 16px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .miss-h .m-tag {
    font-size: 11.5px; font-weight: 600; color: #b45309; background: #fffbeb;
    border: 1px solid #fde68a; border-radius: 999px; padding: 3px 9px;
  }
  .miss-h code {
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 15px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 1px 7px;
  }
  .miss-p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.7; color: #475569; }
  .miss-decode {
    margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center;
    font-size: 12.5px; color: #475569;
  }
  .miss-decode .dc {
    background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px;
  }
  .miss-decode .dc b { color: var(--ink); font-weight: 600; }
  .miss-note {
    margin-top: 10px; font-size: 12.5px; line-height: 1.7; color: #92400e;
    background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 9px 12px;
  }
  .miss-sub {
    margin-top: 16px; font-size: 13px; font-weight: 700; color: var(--ink);
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .miss-sub span { font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .miss-cands { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .miss-cand {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    font-family: inherit; background: #fff; border: 0; border-bottom: 1px solid #eef2f7;
    padding: 11px 14px; cursor: pointer; transition: background .12s;
  }
  .miss-cand:last-child { border-bottom: 0; }
  .miss-cand:hover { background: #f8fafc; }
  .miss-cand .mc-model { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .miss-cand > span:first-child { display: flex; flex-direction: column; min-width: 0; }
  .miss-cand .mc-spec { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .miss-cand .mc-go { margin-left: auto; color: var(--accent); font-size: 12.5px; white-space: nowrap; }
  .miss-acts { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .miss-acts button {
    font-family: inherit; font-size: 13px; border-radius: 9px; padding: 9px 14px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .miss-acts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .miss-acts button:hover { filter: brightness(.98); }

  /* ---------- 表格（桌面） ---------- */
  /* 桌面：不做内嵌滚动，表格随页面一起滚到底（表头吸顶） */
  .tbl-wrap {
    margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    overflow: visible; min-height: 0;
  }
  /* 中等宽度：列挤不下时才允许横向滚动，避免撑破页面 */
  @media (min-width: 861px) and (max-width: 1023px) {
    .tbl-wrap { overflow-x: auto; }
    .topbar { padding: 12px 16px; }
    .wrap { padding: 16px; }
    .tb-title small { display: none; }
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th:first-child { border-top-left-radius: 13px; }
  thead th:last-child { border-top-right-radius: 13px; }
  #thead th:last-child, #tbody td:last-child { padding-right: 18px; }
  thead th {
    position: sticky; top: 0; background: #e9eef5; color: #33465c; font-size: 12.5px; font-weight: 600;
    letter-spacing: .2px; text-align: left; padding: 9px 12px; border-bottom: 1px solid #cbd6e2; white-space: nowrap; z-index: 2;
    box-shadow: 0 6px 10px -12px rgba(10, 24, 40, .55);
  }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #edf1f6; white-space: nowrap; vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.model { font-weight: 600; font-family: Consolas, "Courier New", monospace; font-size: 13.5px; }
  .brand-tag {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: #3d4f63;
    border: 1px solid #dbe3ec; border-radius: 5px; padding: 1px 6px; background: #f7f9fc; white-space: nowrap;
  }
  .brand-tag .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .cat-tag {
    display: inline-block; font-size: 12px; color: var(--accent); background: var(--accent-soft);
    border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .dim { color: var(--muted); }
  .muted-cell { color: #5b6b82; }

  /* ---------- 对比 / 反查 / 等价 ---------- */
  td.cmp-col, th.cmp-col { text-align: center; width: 44px; }
  .cmp-box { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .cmp-chip {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .cmp-chip input { width: 13px; height: 13px; accent-color: var(--accent); }
  .cmp-tray {
    display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: #0f172a; color: #fff; border-radius: 999px; padding: 9px 10px 9px 18px;
    font-size: 12.5px; z-index: 40; box-shadow: 0 12px 30px -12px rgba(15, 23, 42, .6);
    align-items: center; gap: 10px; max-width: min(92vw, 680px);
  }
  /* 底部托盘出现时上滑一下：transform 里必须带上 translateX(-50%)，否则居中会丢 */
  @keyframes trayUp {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .cmp-tray.show { display: flex; animation: trayUp .22s cubic-bezier(.22, .61, .36, 1) both; }
  .inquiry-tray { bottom: 70px; background: #14532d; }
  .inquiry-tray .t-go { background: #0f766e; }
  .inquiry-tray .t-clear { background: rgba(255, 255, 255, .14); }
  .combo-tray { bottom: 122px; background: #1e3a8a; }
  .combo-tray .t-go { background: #0e7490; text-decoration: none; display: inline-block; }
  .combo-tray .t-clear { background: rgba(255, 255, 255, .14); }
  .cmp-tray .t-models { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd5e1; }
  .cmp-tray button {
    font-family: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 6px 13px; cursor: pointer;
  }
  .cmp-tray .t-go { background: linear-gradient(180deg, #0e7490, #0e7490); color: #fff; }
  .cmp-tray .t-clear { background: rgba(255, 255, 255, .14); color: #e2e8f0; }
  .fit-tag {
    display: inline-block; font-size: 11px; border-radius: 5px; padding: 1px 6px; white-space: nowrap;
  }
  .fit-tag.direct { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }
  .fit-tag.adapter { color: #92400e; background: #fffbeb; border: 1px solid #fde68a; }
  .lf-banner {
    flex: 1 1 100%; background: var(--accent-soft); border: 1px solid #b6dcec; color: #0b4a6b;
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: flex; align-items: center;
    gap: 6px; flex-wrap: wrap;
  }
  .lf-banner b { font-weight: 700; }
  .lf-banner .lf-close {
    margin-left: auto; font-family: inherit; font-size: 11.5px; border: 1px solid #7fb8d4;
    background: #fff; color: var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  .x-block { padding: 4px 18px 12px; }
  .x-btn {
    width: 100%; font-family: inherit; font-size: 13px; color: var(--accent); background: var(--accent-soft);
    border: 1px solid #b6dcec; border-radius: 10px; padding: 10px 12px; cursor: pointer;
  }
  .x-btn:hover { background: #dbeafe; }
  a.x-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  /* 询价清单底部操作条：贴在弹层底边常驻，主按钮占满、清空为次要按钮 */
  .inq-actions {
    position: sticky; bottom: 0; z-index: 2; margin-top: 6px;
    display: flex; gap: 10px; padding: 10px 18px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .inq-actions .x-btn { width: auto; flex: 0 0 auto; white-space: nowrap; }
  .inq-actions .inq-copy {
    flex: 1 1 auto; color: #fff; border-color: transparent; font-weight: 600;
    background: linear-gradient(180deg, #0e7490, #0e7490);
  }
  .inq-actions .inq-copy:hover { background: linear-gradient(180deg, #0e7490, #0e7490); filter: brightness(1.06); }
  .inq-actions .inq-clear { color: #dc2626; background: #fff; border-color: #fecaca; }
  .inq-actions .inq-clear:hover { background: #fef2f2; border-color: #fca5a5; }
  .sheet-inq, .sheet-combo { padding-bottom: 0; }
  /* 弹层表格（询价清单 / 搭配台）：窄屏下型号与品牌可换行，避免要横向滚动才能看到操作按钮 */
  .wrap-table td, .wrap-table th { white-space: normal; }
  .wrap-table td.k { width: auto; }
  .wrap-table td:first-child, .wrap-table th:first-child { width: 44px; white-space: nowrap; }
  .wrap-table td:last-child, .wrap-table th:last-child { width: 1%; white-space: nowrap; }
  .x-title { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .x-title .x-note { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 6px; }
  .x-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .x-item {
    display: flex; align-items: center; gap: 7px; font-family: inherit; cursor: pointer;
    border: 1px solid var(--line); background: #fbfdff; border-radius: 10px; padding: 5px 9px 5px 5px;
  }
  .x-item:hover { border-color: #7fb8d4; background: var(--accent-soft); }
  .x-item svg { width: 30px; height: 30px; border-radius: 6px; }
  .x-item .x-model { font-size: 12px; font-weight: 600; font-family: Consolas, "Courier New", monospace; }
  .inq-add {
    margin-left: auto; font-family: inherit; font-size: 11.5px; cursor: pointer;
    color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 999px; padding: 4px 12px;
    white-space: nowrap;
  }
  .inq-add.on { background: #dcfce7; border-color: #86efac; font-weight: 600; }
  .combo-add { color: #0b4a6b; background: #eaf4fb; border-color: #b6dcec; }
  .combo-add.on { background: #dbeafe; border-color: #7fb8d4; font-weight: 600; color: #0b4a6b; }
  .combo-add + .inq-add { margin-left: 0; }
  /* 收藏：列表星标 + 详情按钮，收藏后搭配页选择器可直接选 */
  td.fav-col, th.fav-col { text-align: center; width: 30px; padding-left: 4px; padding-right: 0; }
  .fav-btn {
    font-family: inherit; font-size: 13px; line-height: 1; cursor: pointer; vertical-align: middle;
    border: 0; background: transparent; color: #cbd5e1; padding: 3px 2px; border-radius: 6px;
  }
  .fav-btn:hover { color: #f59e0b; background: #fffbeb; }
  .fav-btn.on { color: #f59e0b; }
  .card-fav { flex: 0 0 auto; }
  .fav-add { color: #b45309; background: #fffbeb; border-color: #fde68a; }
  .fav-add:hover { background: #fef3c7; border-color: #fcd34d; }
  .fav-add.on { background: #fef3c7; border-color: #fcd34d; font-weight: 600; }
  .x-mini {
    font-family: inherit; font-size: 11px; border: 1px solid var(--line); background: #fff;
    color: var(--accent); border-radius: 7px; padding: 3px 9px; cursor: pointer; margin-left: 6px;
  }
  .x-mini:hover { border-color: #7fb8d4; }
  .x-mini.danger { color: #dc2626; border-color: #fecaca; }
  .x-mini.danger:hover { background: #fef2f2; }
  .sheet-wide { max-width: 920px; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cmp-table th, .cmp-table td {
    border-bottom: 1px solid #f1f5f9; padding: 7px 10px; vertical-align: top; word-break: break-all;
  }
  .cmp-table thead th { position: sticky; top: 0; background: var(--panel); font-size: 12px; }
  .cmp-table td.k { color: var(--muted); white-space: nowrap; width: 34%; }
  .cmp-table td.diff { background: #fefce8; }
  td.art-cell { padding: 4px 6px 4px 8px; width: 52px; }
  td.art-cell svg, .card-art svg { display: block; border-radius: 8px; }
  td.art-cell svg { width: 44px; height: 44px; }
  .card-art svg { width: 72px; height: 72px; }
  .sheet-art svg { width: 180px; height: 180px; display: block; margin: 12px auto 2px; }
  .sheet-art { border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }

  /* ---------- 卡片（移动端） ---------- */
  .cards { display: none; margin-top: 10px; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px;
    cursor: pointer;
  }
  .card:active { background: var(--accent-soft); }
  .card-flex { display: flex; gap: 12px; align-items: flex-start; }
  .card-art { flex: 0 0 auto; }
  .card-main { flex: 1 1 auto; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-model { font-weight: 700; font-size: 15.5px; font-family: Consolas, "Courier New", monospace; word-break: break-all; }
  .card-specs {
    margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .card-specs .spec {
    display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%;
    background: #f8fafc; border: 1px solid #eef2f7; border-radius: 7px;
    padding: 4px 10px; font-size: 12.5px; line-height: 1.5;
  }
  .card-specs .k { color: var(--muted); flex: 0 0 auto; }
  .card-specs .v { color: var(--ink); font-weight: 600; word-break: break-word; font-variant-numeric: tabular-nums; }
  /* 同规格可替换备注：弱化处理，避免抢型号与参数 */
  .eq-note {
    margin-top: 8px; font-size: 12.5px; line-height: 1.6; color: var(--muted);
    border-top: 1px dashed var(--line); padding-top: 7px;
  }
  .x-tip { margin-top: 7px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }

  /* ---------- 分页 ---------- */
  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
  .pager button {
    font-family: inherit; font-size: 13.5px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 10px; padding: 9px 18px; cursor: pointer;
  }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager button:not(:disabled):hover { border-color: #0e7490; color: var(--accent); }
  .pager .pg-info { font-size: 13.5px; color: var(--muted); }

  /* ---------- 详情弹层 ---------- */
  .mask {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, .55); z-index: 50;
    align-items: flex-end; justify-content: center; padding: 0;
  }
  .mask.show { display: flex; }
  /* 打开详情只做「面板滑进来」这一件事：每次 show 都是新 display，动画自然只播一次 */
  @keyframes maskIn { from { background: rgba(15, 23, 42, 0); } }
  @keyframes sheetRise { from { opacity: 0; transform: translateY(22px); } }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .mask.show { animation: maskIn .2s ease-out both; }
  .mask.show .sheet { animation: sheetRise .24s cubic-bezier(.22, .61, .36, 1) both; }
  @media (max-width: 639px) {
    .mask.show .sheet { animation-name: sheetUp; animation-duration: .26s; }
  }
  .sheet {
    background: var(--panel); width: 100%; max-width: 640px; min-width: 0; max-height: 86vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 0 0 16px;
  }
  /* 窄屏兜底：flex 子项默认 min-width:auto 会被长内容顶宽，弹出层曾经因此比屏幕宽 */
  .sheet * { min-width: 0; }
  @media (min-width: 640px) {
    .mask { align-items: center; padding: 20px; }
    .sheet { border-radius: 13px; }
  }
  .sheet-head {
    position: sticky; top: 0; background: var(--panel); padding: 16px 18px 10px;
    border-bottom: 1px solid var(--line); z-index: 2;
  }
  .sheet-head .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  /* 详情操作按钮独立一行：避免与 logo / 类别 / 关闭键在窄屏抢宽度换行 */
  .sheet-acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .sheet-acts .inq-add { margin-left: 0; }
  .sheet-model { font-size: 19px; font-weight: 700; font-family: Consolas, "Courier New", monospace; word-break: break-all; }
  .sheet-close {
    margin-left: auto; border: 1px solid var(--line); background: #fff; color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; flex: 0 0 auto;
  }
  .sheet-logo { height: 22px; max-width: 120px; object-fit: contain; }
  .sheet-meta { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn-csv {
    margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-family: inherit; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .btn-csv:hover { border-color: var(--accent); color: var(--accent); }
  .kv-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; }
  .kv-table td { padding: 8px 18px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  .kv-table td.k { color: var(--muted); width: 40%; white-space: nowrap; }
  .kv-table td.v { word-break: break-all; }
  .kv-table tr:last-child td { border-bottom: 0; }
  /* 窄屏：字段名不再强制单行，否则 6 字标题 + 左右各 18px 内边距会把表格顶出弹层 */
  @media (max-width: 520px) {
    .kv-table { table-layout: fixed; }
    .kv-table td { padding: 8px 12px; }
    .kv-table td.k { width: 34%; white-space: normal; }
  }

  footer {
    max-width: 1200px; margin: 0 auto; padding: 0 28px 40px; font-size: 13px; color: var(--muted); line-height: 1.8;
  }

  /* ---------- 中等宽度（小笔记本）：收紧表格，尽量一屏放下全部列 ---------- */
  @media (min-width: 861px) and (max-width: 1279px) {
    table { font-size: 13px; }
    thead th { font-size: 12px; padding: 10px 8px; }
    tbody td { padding: 10px 8px; }
    td.model { font-size: 12.5px; }
    td.art-cell { padding: 4px 4px 4px 6px; }
    #thead th:last-child, #tbody td:last-child { padding-right: 12px; }
  }

  /* ---------- 移动端 ---------- */
  @media (max-width: 860px) {
    .tbl-wrap { display: none; }
    .cards { display: flex; }
    /* 类别标签换行铺满，不做横向截断 */
    .tabs { flex-wrap: wrap; }
    .wrap { padding: 12px 12px 48px; }
    .topbar { padding: 10px 14px; }
    .tb-title { font-size: 18px; }
    .filters { padding: 10px 12px; gap: 8px 14px; }
    .f-reset { margin-left: 0; }
    .f-num { width: 84px; }
    .tb-row { gap: 8px; }
    /* 导航：窄屏独占一行横滑，不再拆成上下两个按钮 */
    .pnav { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .pnav > a, .pnav > .on { font-size: 12.5px; padding: 6px 0; }
  }

  /* ---------- 品牌标识（四角取景框，右上实心角 = 已选中） ---------- */

  /* ---------- 模块图标 ---------- */

  /* ---------- 移动端：标识与导航收紧，5 个页签一屏放下 ---------- */
  @media (max-width: 860px) {
    .tb-mark { width: 24px; height: 24px; }
    .tb-title { gap: 8px; }
    .brand { gap: 9px; }
    .pnav { gap: 4px; }
    .pnav > a, .pnav > .on { font-size: 12px; padding: 6px 0; }
  }

  /* ---------- 交互反馈：只做「看得见的状态改变」，不做会被重算打断的入场动画 ---------- */
  /* 切页签才播一次；搜索 / 筛选 / 翻页不播，否则每敲一个字列表都在抖 */
  @keyframes listIn { from { opacity: 0; transform: translateY(6px); } }
  .list-in { animation: listIn .26s ease-out both; }

  @media (prefers-reduced-motion: reduce) {
    tbody tr { transition: none; }
    .list-in, .mask.show, .mask.show .sheet { animation: none; }
    .cmp-tray.show { animation: none; }
    .tab-ind { transition: none !important; }
  }
</style>
</head>
